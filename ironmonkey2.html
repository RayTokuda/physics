    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        /* Custom Styles for aesthetic appeal */
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f3f4f6;
            color: #1f2937;
        }
        .exam-container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        .theme-header {
            background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%);
            color: white;
            padding: 2rem;
            position: relative;
        }
        .svg-illustration {
            width: 100%;
            height: auto;
            max-height: 200px;
            background: #f8fafc;
            border-radius: 8px;
            margin: 1rem 0;
            border: 1px solid #e2e8f0;
        }
        .question-card {
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            background: #fafafa;
        }
        .sticky-timer {
            position: fixed;
            top: 1rem;
            right: 1rem;
            background: #ef4444;
            color: white;
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            z-index: 50;
            font-size: 0.875rem;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-top: 0.5rem;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
        }
        select {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-top: 0.5rem;
            background-color: white;
        }
        .mc-option {
            display: flex;
            align-items: center;
            margin-bottom: 0.5rem;
        }
        .mc-option input {
            margin-right: 0.75rem;
            width: 1.25rem;
            height: 1.25rem;
        }
        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            justify-content: center;

            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);

            align-items: center;
            justify-content: center;
            z-index: 100;
        }

            background: white;
            padding: 2rem;
            border-radius: 12px;
            max-width: 400px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);

</head>
<body>

    <script type="text/babel">

        // Equations formatted with JSX superscripts & subscripts
        const KINEMATICS_EQUATIONS = [

                missing: <span>x - x<sub>0</sub></span>,
                rawText: "v = v0 + at"

        // 10 Unique Themes

                puzzle: {

                    ans: "60",

                }
            },
            {
                name: "Time Traveler",
                hero: "Chronos",
                rolePrompt: "Temporal Designation",
                affirmation: "You swear on the timeline that this event is isolated, and no future or past versions of yourself provided answers.",
                jumpAction: "launches into the rift using a mechanical chrono-spring platform",
                jumpPrep: "winds and depresses the chrono-spring platform down over a distance of",
                villain: "the Time Cops",
                fallingItem: "a paradox blueprint",
                color: "#a21caf",
                bgGradient: "linear-gradient(135deg, #701a75 0%, #c026d3 100%)",
                puzzle: {
                    q: "Chronos travels through time. Yesterday was two days after Monday. What day of the week is tomorrow?",
                    ans: "Friday",
                    placeholder: "Enter day of week..."
                }
            },
            {
                name: "Deep Sea Diver",
                hero: "Captain Nemo",
                rolePrompt: "Aquatic Callsign",
                affirmation: "By the depths of the abyss, you affirm this exploration was charted alone without sonar links to other vessels.",
                jumpAction: "springs upward through the water using pressurized suit leg-coils",
                jumpPrep: "crouches and compresses the suit's heavy leg-coils over a distance of",
                villain: "the Leviathan",
                fallingItem: "an Atlantean relic",
                color: "#0369a1",
                bgGradient: "linear-gradient(135deg, #082f49 0%, #0284c7 100%)",
                puzzle: {
                    q: "Captain Nemo has 3 treasure chests (Red, Blue, Green). Exactly one contains gold. The Red chest says 'The gold is in Green'. The Blue chest says 'The gold is not here'. The Green chest says 'Red is lying'. If at most one statement is true, which chest contains the gold?",
                    ans: "Blue",
                    placeholder: "Red, Blue, or Green..."
                }
            }
        ];

        // Utility to generate deterministic random numbers
        const pseudoRandom = (seed) => {
            let x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        };

        const randomRange = (seed, min, max) => min + pseudoRandom(seed) * (max - min);
        const randomInt = (seed, min, max) => Math.floor(randomRange(seed, min, max + 1));

        // Generate the 10 Exams
        const generateExams = () => {
            return THEMES.map((theme, index) => {
                const seed = index + 42;
                
                // --- Math Variables for Questions ---
                
                // Q4a: Max Height H
                const H = randomInt(seed, 15, 30);
                const v0_4a = Math.sqrt(19.6 * H).toFixed(2);
                
                // Q4b: Bend distance d
                const d = Number(randomRange(seed + 1, 0.2, 0.5).toFixed(2));
                const a_4b = (Math.pow(v0_4a, 2) / (2 * d)).toFixed(2);
                const gs_4b = (a_4b / 9.8).toFixed(1);

                // Decoy generator for numerical MC
                const generateDecoys = (correctAnswer, numDecoys, variance) => {
                    let numVal = parseFloat(correctAnswer);
                    let set = new Set();
                    set.add(numVal.toFixed(2));
                    let attempts = 0;
                    while(set.size < numDecoys + 1 && attempts < 100) {
                        let factor = randomRange(seed + attempts * 3, 1 - variance, 1 + variance);
                        let decoy = (numVal * factor).toFixed(2);
                        if (numVal === 0) {
                            decoy = (randomRange(seed + attempts * 3, -10, 10)).toFixed(2);
                        }
                        if (decoy !== numVal.toFixed(2)) set.add(decoy);
                        attempts++;
                    }
                    return Array.from(set).sort((a,b) => parseFloat(a) - parseFloat(b));
                };

                const numOptions4a = generateDecoys(v0_4a, 6, 0.5);
                const numOptions4b = generateDecoys(a_4b, 6, 0.7);
                const numOptions4b_gs = generateDecoys(gs_4b, 6, 0.5);

                // Q5: Graph combinations
                const q5_types = [
                    pseudoRandom(seed+2) > 0.5 ? 'pos_v_pos_a' : 'pos_v_neg_a',
                    pseudoRandom(seed+3) > 0.5 ? 'neg_v_neg_a' : 'neg_v_pos_a',
                    pseudoRandom(seed+4) > 0.5 ? 'const_pos_v' : 'const_neg_v',
                    'zero_v'
                ];
                // Shuffle them
                for (let i = q5_types.length - 1; i > 0; i--) {
                    const j = Math.floor(pseudoRandom(seed+i) * (i + 1));
                    [q5_types[i], q5_types[j]] = [q5_types[j], q5_types[i]];
                }

                // Q6: x(t) = a*t - b*t^2
                const b_6 = randomInt(seed+5, 5, 12);
                const a_6 = randomInt(seed+6, b_6 * 5, b_6 * 9); 
                const t_turn_6 = a_6 / (2 * b_6);
                const v_0_6 = a_6;
                const pos_turn_6 = a_6 * t_turn_6 - b_6 * t_turn_6 * t_turn_6;
                const pos_5_6 = a_6 * 5 - b_6 * 25;
                const dist_5_6 = pos_turn_6 + (pos_turn_6 - pos_5_6);

                const numOptions6c_time = generateDecoys(t_turn_6.toFixed(2), 6, 0.5);
                const numOptions6c_pos = generateDecoys(pos_turn_6.toFixed(2), 6, 0.5);
                const numOptions6d = generateDecoys(pos_5_6.toFixed(2), 6, 0.5);
                const numOptions6e = generateDecoys(dist_5_6.toFixed(2), 6, 0.5);

                const unitOptionsA = ["m/s", "m/s^2", "m", "s", "m*s", "1/s"];
                const unitOptionsB = ["m/s^2", "m/s", "m", "s", "m*s^2", "1/s^2"];

                // Q7: Two objects meeting (ensuring altitude of catch is positive)
                let v1_7, H_7, v2_7, a_quad, b_quad, c_quad, desc, t2_7, ans_t2_7, ans_pos_7, catch_alt;
                let attempts = 0;
                do {
                    v1_7 = randomInt(seed+7+attempts, 15, 25);
                    H_7 = randomInt(seed+8+attempts, 8, 15);
                    v2_7 = randomInt(seed+9+attempts, -5, -1);
                    
                    // Intersection: -4.9t^2 + (v1 - v2)t - H = 0
                    a_quad = 4.9;
                    b_quad = -(v1_7 - v2_7);
                    c_quad = H_7;
                    desc = b_quad*b_quad - 4*a_quad*c_quad;
                    if (desc >= 0) {
                        t2_7 = (-b_quad + Math.sqrt(desc)) / (2*a_quad);
                        ans_t2_7 = t2_7.toFixed(2);
                        catch_alt = v1_7 * t2_7 - 4.9 * t2_7 * t2_7;
                        ans_pos_7 = catch_alt.toFixed(2);
                    } else {
                        catch_alt = -1;
                    }
                    attempts++;
                } while (catch_alt <= 0 && attempts < 100);

                const numOptions7_time = generateDecoys(ans_t2_7, 6, 0.5);
                const numOptions7_pos = generateDecoys(ans_pos_7, 6, 0.5);

                return {
                    id: index,
                    theme,
                    vars: {
                        H, v0_4a, d, a_4b, gs_4b, numOptions4a, numOptions4b, numOptions4b_gs,
                        q5_types,
                        a_6, b_6, t_turn_6, pos_turn_6, pos_5_6, dist_5_6,
                        numOptions6c_time, numOptions6c_pos, numOptions6d, numOptions6e,
                        unitOptionsA, unitOptionsB,
                        v1_7, H_7, v2_7, ans_t2_7, ans_pos_7,
                        numOptions7_time, numOptions7_pos
                    }
                };
            });
        };

        const EXAMS = generateExams();

        // ==========================================
        // REACT COMPONENTS
        // ==========================================

        const MessageModal = ({ isOpen, message, onClose }) => {
            if (!isOpen) return null;
            return (
                <div className="modal-overlay">
                    <div className="modal-content">
                        <h3 className="text-xl font-bold mb-4 text-gray-800">Notice</h3>
                        <p className="text-gray-600 mb-6">{message}</p>
                        <button className="btn btn-primary" onClick={onClose}>Understood</button>
                    </div>
                </div>
            );
        };

        // Graph Generation Utilities for Q5
        const GraphQ5 = ({ types }) => {
            let currentY = 100;
            let currentX = 10;
            const segmentWidth = 70;
            let pathD = `M ${currentX},${currentY} `;

            types.forEach((type) => {
                const nextX = currentX + segmentWidth;
                let nextY = currentY;

                if (type === 'const_pos_v') {
                    nextY = currentY - 40;
                    pathD += `L ${nextX},${nextY} `;
                } else if (type === 'const_neg_v') {
                    nextY = currentY + 40;
                    pathD += `L ${nextX},${nextY} `;
                } else if (type === 'zero_v') {
                    pathD += `L ${nextX},${nextY} `;
                } else if (type === 'pos_v_pos_a') {
                    nextY = currentY - 50;
                    pathD += `Q ${currentX + segmentWidth*0.8},${currentY} ${nextX},${nextY} `;
                } else if (type === 'pos_v_neg_a') {
                    nextY = currentY - 50;
                    pathD += `Q ${currentX + segmentWidth*0.2},${nextY} ${nextX},${nextY} `;
                } else if (type === 'neg_v_pos_a') {
                    nextY = currentY + 50;
                    pathD += `Q ${currentX + segmentWidth*0.2},${nextY} ${nextX},${nextY} `;
                } else if (type === 'neg_v_neg_a') {
                    nextY = currentY + 50;
                    pathD += `Q ${currentX + segmentWidth*0.8},${currentY} ${nextX},${nextY} `;
                }

                if (nextY < 20) nextY = 20;
                if (nextY > 180) nextY = 180;

                currentX = nextX;
                currentY = nextY;
            });

            return (
                <div className="flex flex-col items-center my-6">
                    <svg width="350" height="220" className="bg-white border border-gray-300 rounded shadow-sm">
                        {/* Grid / Axes */}
                        <line x1="10" y1="10" x2="10" y2="200" stroke="#94a3b8" strokeWidth="2" />
                        <line x1="10" y1="200" x2="330" y2="200" stroke="#94a3b8" strokeWidth="2" />
                        <text x="15" y="20" fontSize="12" fill="#64748b">x(t)</text>
                        <text x="310" y="215" fontSize="12" fill="#64748b">time</text>
                        
                        {/* Separators */}
                        <line x1="80" y1="10" x2="80" y2="200" stroke="#cbd5e1" strokeDasharray="4" />
                        <line x1="150" y1="10" x2="150" y2="200" stroke="#cbd5e1" strokeDasharray="4" />
                        <line x1="220" y1="10" x2="220" y2="200" stroke="#cbd5e1" strokeDasharray="4" />
                        
                        {/* Region Labels */}
                        <text x="40" y="30" fontSize="14" fontWeight="bold" fill="#334155">1</text>
                        <text x="110" y="30" fontSize="14" fontWeight="bold" fill="#334155">2</text>
                        <text x="180" y="30" fontSize="14" fontWeight="bold" fill="#334155">3</text>
                        <text x="250" y="30" fontSize="14" fontWeight="bold" fill="#334155">4</text>

                        {/* Function Path */}
                        <path d={pathD} fill="none" stroke="#2563eb" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round" />
                    </svg>
                </div>
            );
        };

        const VelocityGraphOption = ({ type, label }) => {
            let pathD = "";
            if (type === 'pos_v_pos_a') pathD = "M 10,40 L 90,10";
            if (type === 'pos_v_neg_a') pathD = "M 10,10 L 90,40";
            if (type === 'neg_v_pos_a') pathD = "M 10,90 L 90,60";
            if (type === 'neg_v_neg_a') pathD = "M 10,60 L 90,90";
            if (type === 'const_pos_v') pathD = "M 10,25 L 90,25";
            if (type === 'const_neg_v') pathD = "M 10,75 L 90,75";
            if (type === 'zero_v') pathD = "M 10,50 L 90,50";
            if (type === 'decoy') pathD = "M 10,50 L 90,10";

            return (
                <div className="flex flex-col items-center bg-white p-2 border border-gray-200 rounded">
                    <svg width="100" height="100">
                        <line x1="10" y1="10" x2="10" y2="90" stroke="#94a3b8" strokeWidth="1" />
                        <line x1="10" y1="50" x2="90" y2="50" stroke="#94a3b8" strokeWidth="1" />
                        <text x="2" y="30" fontSize="8" fill="#64748b" transform="rotate(-90 2,30)">Velocity</text>
                        <text x="40" y="98" fontSize="8" fill="#64748b">Time</text>
                        <path d={pathD} fill="none" stroke="#dc2626" strokeWidth="3" />
                    </svg>
                    <span className="font-bold mt-1 text-lg">{label}</span>
                </div>
            );
        };

        const App = () => {
            const [examState, setExamState] = React.useState('intro'); // intro, exam, results, debug
            const [debugSelectedExam, setDebugSelectedExam] = React.useState('all');
            const [activeExamIdx, setActiveExamIdx] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [timeLeft, setTimeLeft] = React.useState(TIME_LIMIT_MINUTES * 60);
            const [modalConfig, setModalConfig] = React.useState({ isOpen: false, message: '' });
            const [score, setScore] = React.useState({ total: 0, ec: 0 });

            const exam = EXAMS[activeExamIdx];

            React.useEffect(() => {
                let timer;
                if (examState === 'exam' && TIME_LIMIT_MINUTES > 0 && TIME_LIMIT_MINUTES !== Infinity) {
                    timer = setInterval(() => {
                        setTimeLeft((prev) => {
                            if (prev <= 1) {
                                clearInterval(timer);
                                autoSubmit();
                                return 0;
                            }
                            return prev - 1;
                        });
                    }, 1000);
                }
                return () => clearInterval(timer);
            }, [examState]);

            const startExam = () => {
                const randIdx = Math.floor(Math.random() * EXAMS.length);
                setActiveExamIdx(randIdx);
                setAnswers({});
                setTimeLeft(TIME_LIMIT_MINUTES * 60);
                setExamState('exam');
            };

            const handleAnswerChange = (qKey, value) => {
                setAnswers(prev => ({ ...prev, [qKey]: value }));
            };

            const showModal = (msg) => setModalConfig({ isOpen: true, message: msg });

            const formatTime = (seconds) => {
                if (TIME_LIMIT_MINUTES === 0 || TIME_LIMIT_MINUTES === Infinity) return "No Limit";
                const m = Math.floor(seconds / 60).toString().padStart(2, '0');
                const s = (seconds % 60).toString().padStart(2, '0');
                return `${m}:${s}`;
            };

            const gradeExam = (userAnswers) => {
                let pts = { q1:0, q2:0, q3:0, q4a:0, q4b:0, q5:0, q6:0, q7:0 };
                let ecPts = 0;

                const checkNum = (u, e) => {
                    if (!u || isNaN(u)) return false;
                    const userVal = parseFloat(u);
                    const expectedVal = parseFloat(e);
                    // 3% tolerance or 0.1 margin, whichever is greater
                    const tol = Math.max(0.1, Math.abs(expectedVal * 0.03));
                    return Math.abs(userVal - expectedVal) <= tol;
                };

                // Q1: 5pts
                if (userAnswers.q1 === 'True') pts.q1 = 5;
                
                // Q2: 5pts
                if (userAnswers.q2 === 'much larger than 9.8 m/s^2') pts.q2 = 5;
                
                // Q3: 5pts
                if (userAnswers.q3 === '-9.8 m/s^2') pts.q3 = 5;

                // Q4a: 15pts (eq=5, alg=5, num=5)
                if (checkNum(userAnswers.q4a_num, exam.vars.v0_4a)) {
                    pts.q4a = 15;
                } else {
                    if (userAnswers.q4a_eq === '3') pts.q4a += 5;
                    if (userAnswers.q4a_alg && userAnswers.q4a_alg.trim() !== '') pts.q4a += 5;
                }

                // Q4b: 20pts
                if (checkNum(userAnswers.q4b_num, exam.vars.a_4b)) {
                    pts.q4b += 15;
                } else {
                    if (userAnswers.q4b_eq === '3') pts.q4b += 5;
                    if (userAnswers.q4b_alg && userAnswers.q4b_alg.trim() !== '') pts.q4b += 5;
                }
                if (checkNum(userAnswers.q4b_gs, exam.vars.gs_4b)) pts.q4b += 5;

                // Q5: 8pts (2pts each)
                const q5AnswerMap = {
                    'pos_v_pos_a': 'a', 'pos_v_neg_a': 'b',
                    'neg_v_pos_a': 'c', 'neg_v_neg_a': 'd',
                    'const_pos_v': 'e', 'const_neg_v': 'f',
                    'zero_v': 'g'
                };
                exam.vars.q5_types.forEach((type, idx) => {
                    const correctLetter = q5AnswerMap[type];
                    if (userAnswers[`q5_${idx+1}`] === correctLetter) pts.q5 += 2;
                });

                // Q6: 30pts (5pts each x 6 tracking components)
                let q6_num_count = 0;
                if (checkNum(userAnswers.q6c_time, exam.vars.t_turn_6)) q6_num_count++;
                if (checkNum(userAnswers.q6c_pos, exam.vars.pos_turn_6)) q6_num_count++;
                if (checkNum(userAnswers.q6d, exam.vars.pos_5_6)) q6_num_count++;
                if (checkNum(userAnswers.q6e, exam.vars.dist_5_6)) q6_num_count++;

                if (q6_num_count === 4) {
                    pts.q6 = 30;
                } else {
                    if (userAnswers.q6a_a === 'm/s' && userAnswers.q6a_b === 'm/s^2') pts.q6 += 5;
                    if (userAnswers.q6b && userAnswers.q6b.trim() !== '') pts.q6 += 5;
                    pts.q6 += q6_num_count * 5;
                }

                // Q7: 12pts
                let timeCorrect = checkNum(userAnswers.q7_time || userAnswers.q7_num, exam.vars.ans_t2_7);
                let posCorrect = checkNum(userAnswers.q7_pos, exam.vars.ans_pos_7);

                if (timeCorrect && posCorrect) {
                    pts.q7 = 12;
                } else {
                    if (userAnswers.q7_eq1 && userAnswers.q7_eq1.trim() !== '') pts.q7 += 2;
                    if (userAnswers.q7_eq2 && userAnswers.q7_eq2.trim() !== '') pts.q7 += 2;
                    if (timeCorrect) pts.q7 += 4;
                    if (posCorrect) pts.q7 += 4;
                }

                // EC (Q8-14) 1pt each
                if (userAnswers.q8 && userAnswers.q8.trim() !== '') ecPts += 1;
                if (userAnswers.q9 && userAnswers.q9.trim() !== '') ecPts += 1;
                if (userAnswers.q10 && userAnswers.q10.trim() !== '') ecPts += 1;
                if (userAnswers.q11 === '2.41 s') ecPts += 1;
                if (userAnswers.q12 === '2 + √6 s') ecPts += 1;
                if (userAnswers.q13 === '15 m/s') ecPts += 1;
                if (userAnswers.q14 && exam.theme.puzzle) {

                    const expectedVal = exam.theme.puzzle.ans.toString().trim().toLowerCase();
                    if (userVal === expectedVal) ecPts += 1;

                let total = pts.q1 + pts.q2 + pts.q3 + pts.q4a + pts.q4b + pts.q5 + pts.q6 + pts.q7;
                return { total, ec: ecPts, breakdown: pts };

                    'q5_1', 'q5_2', 'q5_3', 'q5_4',
                    'q6a_a', 'q6a_b', 'q6b', 'q6c_time', 'q6c_pos', 'q6d', 'q6e',
                    'q7_eq1', 'q7_eq2', 'q7_time', 'q7_pos'

                    }
                }
                autoSubmit();
            };

                const getExpClass = (score, max) => {
                    if (score === max) return "explanation correct-border";
                    if (score > 0) return "explanation partial-border";
                    return "explanation incorrect-border";
                };

                const htmlContent = `
<!DOCTYPE html>
<html>

            v^2 = v0^2 + 2a&Delta;x &rarr; (${exam.vars.v0_4a})^2 = 0 + 2 * a * ${exam.vars.d}. <br/>
            a = (${exam.vars.v0_4a}^2) / (2 * ${exam.vars.d}) = ${exam.vars.a_4b} m/s^2. <br/>

        </div>
    </div>

        <p>Your Numeric Answer: ${answers.q4b_num} m/s^2</p>
        <p>Your g's: ${answers.q4b_gs}</p>
        <div class="${getExpClass(pts.q4b, 20)}">
            <strong>Score: ${pts.q4b}/20</strong><br/>
            <strong>Solution:</strong> The jump phase starts from v0=0 and ends at final velocity ${exam.vars.v0_4a} m/s. <br/>
            v^2 = v0^2 + 2a&Delta;x &rarr; (${exam.vars.v0_4a})^2 = 0 + 2 * a * ${exam.vars.d}. <br/>
            a = (${exam.vars.v0_4a}^2) / (2 * ${exam.vars.d}) = ${exam.vars.a_4b} m/s^2. <br/>
            g's = ${exam.vars.a_4b} / 9.8 = ${exam.vars.gs_4b}.
        </div>
    </div>

    <div class="q-box">
        <p><strong>Q5 (Graph Matching):</strong></p>
        <p>Your picks: 1:${answers.q5_1}, 2:${answers.q5_2}, 3:${answers.q5_3}, 4:${answers.q5_4}</p>
        <div class="${getExpClass(pts.q5, 8)}">
            <strong>Score: ${pts.q5}/8</strong><br/>
            <strong>Solution:</strong> Concave up = pos accel, concave down = neg accel, straight = zero accel.
        </div>
    </div>

    <div class="q-box">
        <p><strong>Q6 (x(t) = ${exam.vars.a_6}t - ${exam.vars.b_6}t^2):</strong></p>

            v=0 when t = ${exam.vars.a_6} / ${exam.vars.b_6 * 2} = ${exam.vars.t_turn_6.toFixed(2)} s. <br/>
            Turnaround position = ${exam.vars.a_6}(${exam.vars.t_turn_6.toFixed(2)}) - ${exam.vars.b_6}(${exam.vars.t_turn_6.toFixed(2)})^2 = ${exam.vars.pos_turn_6.toFixed(2)} m. <br/>
            Position at t=5 = ${exam.vars.a_6}(5) - ${exam.vars.b_6}(25) = ${exam.vars.pos_5_6.toFixed(2)} m. <br/>
            Total distance = ${exam.vars.pos_turn_6.toFixed(2)} + (${exam.vars.pos_turn_6.toFixed(2)} - ${exam.vars.pos_5_6.toFixed(2)}) = ${exam.vars.dist_5_6.toFixed(2)} m.
        </div>

            Interception position/altitude: y = ${exam.vars.ans_pos_7} m.
        </div>
    </div>
    
</body>
</html>`;
                
                const blob = new Blob([htmlContent], { type: 'text/html' });

            if (examState === 'intro') {

                                                }`).join(', ')}

                                        </div>

                                        {/* Q6 */}
                                        <div className="p-3 bg-gray-50 border border-gray-200 rounded">

                                            </div>

                                        </div>
                                    </div>
                                </div>
                            </div>
                        ))}
                    </div>

                                />
                            </div>

                            <div className="bg-white border border-gray-200 rounded p-4 mb-4 shadow-sm">
                                <label className="block font-semibold mb-1 text-gray-800">2) Equation for {exam.theme.fallingItem} position vs time y<sub>2</sub>(t):</label>
                                <input 
                                    type="text" 
                                    placeholder="e.g. y2 = H + v2*t" 
                                    value={answers.q7_eq2 || ''} 
                                    onChange={e => handleAnswerChange('q7_eq2', e.target.value)} 
                                />
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="bg-white border border-gray-200 rounded p-4 shadow-sm">
                                    <label className="block font-semibold mb-1 text-gray-800">Time of interception (2nd meeting time):</label>
                                    <select 
                                        value={answers.q7_time || answers.q7_num || ''} 
                                        onChange={e => handleAnswerChange('q7_time', e.target.value)} 
                                    >
                                        <option value="">Select Time (s)...</option>
                                        {exam.vars.numOptions7_time.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                                    </select>
                                </div>
                                <div className="bg-white border border-gray-200 rounded p-4 shadow-sm">
                                    <label className="block font-semibold mb-1 text-gray-800">Position / Height of interception:</label>
                                    <select 
                                        value={answers.q7_pos || ''} 
                                        onChange={e => handleAnswerChange('q7_pos', e.target.value)} 
                                    >
                                        <option value="">Select Position (m)...</option>
                                        {exam.vars.numOptions7_pos.map((opt, i) => <option key={i} value={opt}>{opt}</option>)}
                                    </select>
                                </div>
                            </div>
                        </div>

                        {/* Extra Credit Section */}
                        <div className="p-4 border-2 border-yellow-400 bg-yellow-50 rounded-lg mb-6">
                            <h3 className="font-bold text-lg mb-2 text-yellow-800">Mission Briefing Extras (Questions 8 - 14)</h3>
                            <p className="text-sm text-yellow-700 mb-4">Each worth 1 bonus point. These are advanced scenarios for {exam.theme.hero}. Do not attempt unless the primary mission is complete.</p>

                            <div className="mb-6">
                                <label className="block font-bold text-sm mb-1">8) {exam.theme.hero} leaps from a 1.0m high platform with an initial velocity of 15 m/s straight up. How long are they in the air before landing on the ground below?</label>
                                <input type="text" placeholder="e.g. 3.12 s" value={answers.q8 || ''} onChange={e => handleAnswerChange('q8', e.target.value)} />
                            </div>
                            <div className="mb-6">
                                <label className="block font-bold text-sm mb-1">9) {exam.theme.villain} is fleeing at a constant 17 m/s. {exam.theme.hero} is running at 30 m/s and is currently 10 meters behind. What constant acceleration must {exam.theme.hero} apply to just barely avoid a collision?</label>
                                <input type="text" placeholder="e.g. -5.2 m/s^2" value={answers.q9 || ''} onChange={e => handleAnswerChange('q9', e.target.value)} />
                            </div>
                            <div className="mb-6">
                                <label className="block font-bold text-sm mb-1">10) {exam.theme.fallingItem} falls 15m and reaches a terminal velocity of -12.5 m/s. You step off the ledge from rest (a=-9.8 m/s^2) exactly when it reaches terminal velocity. How long does it take you to catch up to it?</label>
                                <input type="text" placeholder="e.g. 2.55 s" value={answers.q10 || ''} onChange={e => handleAnswerChange('q10', e.target.value)} />
                            </div>
                            <div className="mb-6">
                                <label className="block font-bold text-sm mb-1">11) {exam.theme.hero} jumps up and reaches half of their maximum height in exactly 1.0 second. How much additional time does it take them to reach the remaining half to the peak?</label>
                                <select onChange={e => handleAnswerChange('q11', e.target.value)} value={answers.q11 || ''}>
                                    <option value="">Select...</option>
                                    <option value="0.41 s">0.41 s</option>
                                    <option value="2.41 s">2.41 s</option>
                                    <option value="0.71 s">0.71 s</option>
                                    <option value="2.00 s">2.00 s</option>
                                </select>
                            </div>
                            <div className="mb-6">
                                <label className="block font-bold text-sm mb-1">12) {exam.theme.hero} leaps straight up from a 10m high roof at 20 m/s. Assuming g = 10 m/s^2 for simpler math, how long does it take them to hit the ground?</label>
                                <select onChange={e => handleAnswerChange('q12', e.target.value)} value={answers.q12 || ''}>
                                    <option value="">Select...</option>
                                    <option value="4.00 s">4.00 s</option>
                                    <option value="5.00 s">5.00 s</option>
                                    <option value="2 + √6 s">2 + √6 s</option>
                                    <option value="2 - √6 s">2 - √6 s</option>
                                </select>
                            </div>
                            <div className="mb-6">
                                <label className="block font-bold text-sm mb-1">13) {exam.theme.hero} throws a tracker device straight down from a 20m high roof. It hits the ground in exactly 1.0 second. Assuming g = 10 m/s^2, what was its initial downward velocity?</label>
                                <select onChange={e => handleAnswerChange('q13', e.target.value)} value={answers.q13 || ''}>
                                    <option value="">Select...</option>
                                    <option value="10 m/s">10 m/s</option>
                                    <option value="25 m/s">25 m/s</option>
                                    <option value="5 m/s">5 m/s</option>
                                    <option value="20 m/s">20 m/s</option>
                                    <option value="15 m/s">15 m/s</option>
                                </select>
                            </div>
                            <div className="mb-6">
                                <label className="block font-bold text-sm mb-1">14) Logic Puzzle: {exam.theme.puzzle.q}</label>
                                <input type="text" placeholder={exam.theme.puzzle.placeholder} value={answers.q14 || ''} onChange={e => handleAnswerChange('q14', e.target.value)} />
                            </div>
                        </div>

                        <div className="mt-8 mb-12 flex justify-center">
                            <button onClick={handleSubmit} className="btn btn-success text-xl px-12 py-4">Submit Exam</button>
                        </div>

                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
