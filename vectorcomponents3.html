        function initGame() {
            startBtn.addEventListener('click', () => {
                const nameVal = studentNameInput.value.trim();
                if (nameVal) {
                    studentName = nameVal;
                    startScreen.style.opacity = '0';
                    setTimeout(() => {

                        mainGameContainer.classList.remove('opacity-0');
                        startGame();
                    }, 500);
                } else {
                    studentNameInput.classList.add('ring-2', 'ring-red-500');
                    setTimeout(() => studentNameInput.classList.remove('ring-2', 'ring-red-500'), 1000);
                }
            });

            studentNameInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') startBtn.click();
            });

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = gameContainer.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            draw();
        }

        function startGame() {
            score = 0; round = 1;
            let allQuadrants = [1, 2, 3, 4];
            shuffleArray(allQuadrants);
            quadrantOrder = allQuadrants.slice(0, 3); // Take 3 random quadrants
            startRound();
        }

        function startRound() {
            updateUI();
            resetInputs();
            generateVector();
            draw();
        }

        function generateVector() {
            const quadrant = quadrantOrder[round - 1];
            const magnitude = Math.random() * 90 + 10;
            let angleDeg;
            let directionStr;
            const relativeAngle = Math.random() * 70 + 10; // e.g., the 30 in "30 deg N of E"
            currentRelativeAngle = relativeAngle;

            const formatChoice = Math.random() < 0.5;

            switch(quadrant) {
                case 1: // NE Quadrant
                    if (formatChoice) {
                        directionStr = `${relativeAngle.toFixed(1)}° North of East`;
                        angleDeg = relativeAngle;
                        currentBaseDirection = "East"; currentRelativeDirection = "North";
                    } else {
                        directionStr = `${relativeAngle.toFixed(1)}° East of North`;
                        angleDeg = 90 - relativeAngle;
                        currentBaseDirection = "North"; currentRelativeDirection = "East";
                    }
                    break;
                case 2: // NW Quadrant
                    if (formatChoice) {
                        directionStr = `${relativeAngle.toFixed(1)}° North of West`;
                        angleDeg = 180 - relativeAngle;
                        currentBaseDirection = "West"; currentRelativeDirection = "North";
                    } else {
                        directionStr = `${relativeAngle.toFixed(1)}° West of North`;
                        angleDeg = 90 + relativeAngle;
                        currentBaseDirection = "North"; currentRelativeDirection = "West";
                    }
                    break;
                case 3: // SW Quadrant
                    if (formatChoice) {
                        directionStr = `${relativeAngle.toFixed(1)}° South of West`;
                        angleDeg = 180 + relativeAngle;
                        currentBaseDirection = "West"; currentRelativeDirection = "South";
                    } else {
                        directionStr = `${relativeAngle.toFixed(1)}° West of South`;
                        angleDeg = 270 - relativeAngle;
                        currentBaseDirection = "South"; currentRelativeDirection = "West";
                    }
                    break;
                case 4: // SE Quadrant
                    if (formatChoice) {
                        directionStr = `${relativeAngle.toFixed(1)}° South of East`;
                        angleDeg = 360 - relativeAngle;
                        currentBaseDirection = "East"; currentRelativeDirection = "South";
                    } else {
                        directionStr = `${relativeAngle.toFixed(1)}° East of South`;
                        angleDeg = 270 + relativeAngle;
                        currentBaseDirection = "South"; currentRelativeDirection = "East";
                    }
                    break;
            }
            
            currentAngleDeg = angleDeg;
            currentDirectionStr = directionStr;
            const angleRad = angleDeg * Math.PI / 180;
            const vx = magnitude * Math.cos(angleRad);
            const vy = magnitude * Math.sin(angleRad);
            
            const displayMagnitudePx = Math.min(canvas.offsetWidth, canvas.offsetHeight) * 0.4;
            const displayDx = displayMagnitudePx * Math.cos(angleRad);
            const displayDy = -displayMagnitudePx * Math.sin(angleRad);

            originalVector = {
                x: canvas.offsetWidth / 2, y: canvas.offsetHeight / 2,
                dx: displayDx, dy: displayDy,
                vx: vx, vy: vy,
                magnitude: magnitude, color: '#f59e0b'
            };
            
            currentUnit = UNITS[Math.floor(Math.random() * UNITS.length)];
            magnitudeEl.innerHTML = `${magnitude.toFixed(1)} <span class="text-gray-400">${currentUnit}</span>`;
            directionEl.textContent = directionStr;
        }
        
        function drawAxes() {
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            const originX = w / 2;
            const originY = h / 2;
            const PIXELS_PER_UNIT = 30;

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(w, originY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, h); ctx.stroke();
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            for (let x = originX; x < w; x += PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
            for (let x = originX; x > 0; x -= PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
            for (let y = originY; y < h; y += PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
            for (let y = originY; y > 0; y -= PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
        }

        function drawVector(vector, options = {}) {
            ctx.strokeStyle = options.color || vector.color;
            ctx.fillStyle = options.color || vector.color;
            ctx.lineWidth = options.lineWidth || 4;
            const headlen = 10;
            const angle = Math.atan2(vector.dy, vector.dx);
            ctx.beginPath(); ctx.moveTo(vector.x, vector.y); ctx.lineTo(vector.x + vector.dx, vector.y + vector.dy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(vector.x + vector.dx, vector.y + vector.dy);
            ctx.lineTo(vector.x + vector.dx - headlen * Math.cos(angle - Math.PI / 6), vector.y + vector.dy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(vector.x + vector.dx - headlen * Math.cos(angle + Math.PI / 6), vector.y + vector.dy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath(); ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawAxes();
            if (originalVector) { drawVector(originalVector); }
        }
        
        function generateValidationCode(name) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let codeArr = new Array(15).fill('');
            const nameSub = name.substring(0, 3).toUpperCase().padEnd(3, 'X');
            
            // Randomly distribute the 3 letters
            let positions = [];
            while(positions.length < 3){
                let r = Math.floor(Math.random() * 15);
                if(positions.indexOf(r) === -1) positions.push(r);
            }
            
            for(let i=0; i<3; i++) {
                codeArr[positions[i]] = nameSub[i];
            }
            
            for(let i=0; i<15; i++) {
                if(codeArr[i] === '') {
                    codeArr[i] = chars.charAt(Math.floor(Math.random() * chars.length));
                }
            }
            return codeArr.join('');
        }

        function analyzeError(inputX, inputY, actualX, actualY, mag, angleDeg, baseDir, relDir, relAngle) {
            let feedback = "";
            let hint = "\n\n💡 Tip: If you always measure the angle counter-clockwise from the positive X-axis (East), you can just use Vx = V*cos(θ) and Vy = V*sin(θ) and the signs will always be correct automatically!";
            
            // Calculate what happens if they swapped sine and cosine using the RELATIVE angle
            const relRad = relAngle * Math.PI / 180;
            const vCosRel = mag * Math.cos(relRad);
            const vSinRel = mag * Math.sin(relRad);
            
            // Check sign errors
            const wrongSignX = Math.sign(inputX) !== Math.sign(actualX) && Math.abs(Math.abs(inputX) - Math.abs(actualX)) < Math.abs(actualX * VALUE_TOLERANCE);
            const wrongSignY = Math.sign(inputY) !== Math.sign(actualY) && Math.abs(Math.abs(inputY) - Math.abs(actualY)) < Math.abs(actualY * VALUE_TOLERANCE);

            // Check swapped functions
            const swappedFuncX = Math.abs(Math.abs(inputX) - Math.abs(vSinRel)) < Math.abs(vSinRel * VALUE_TOLERANCE);
            const swappedFuncY = Math.abs(Math.abs(inputY) - Math.abs(vCosRel)) < Math.abs(vCosRel * VALUE_TOLERANCE);

            // Check direction wording confusion (e.g., treating "North of West" as "West of North")
            // This usually results in swapped magnitudes
            const confusedDirection = swappedFuncX && swappedFuncY;

            if (confusedDirection) {
                feedback += `It looks like you might have confused "${relDir} of ${baseDir}".\nRemember: "${relDir} of ${baseDir}" means you start looking towards the ${baseDir}, and then turn towards the ${relDir} by the given angle.`;
            } else if (swappedFuncX || swappedFuncY) {
                feedback += `It looks like you might have swapped sine and cosine for the given angle. Depending on how the angle is defined relative to the axes, X is not always cosine and Y is not always sine.`;
            } else if (wrongSignX || wrongSignY) {
                feedback += `You have the correct magnitude, but the wrong sign for at least one component. Look at which quadrant the vector is in!`;
            } else {
                feedback += `Double check your calculations. Ensure your calculator is in degrees, not radians.`;
            }

            return feedback + hint;
        }

        function checkAnswer() {
            let scoreThisRound = 0;
            let feedback = "";
            const totalPointsThisRound = 2;

            const xVal = parseFloat(xInput.value);
            const yVal = parseFloat(yInput.value);
            const xIsCorrect = Math.abs(xVal - originalVector.vx) < Math.abs(originalVector.vx * VALUE_TOLERANCE) + 0.1;
            const yIsCorrect = Math.abs(yVal - originalVector.vy) < Math.abs(originalVector.vy * VALUE_TOLERANCE) + 0.1;

            xInput.classList.toggle('ring-2', true);
            yInput.classList.toggle('ring-2', true);
            xInput.classList.toggle('ring-green-500', xIsCorrect);
            xInput.classList.toggle('ring-red-500', !xIsCorrect);
            yInput.classList.toggle('ring-green-500', yIsCorrect);
            yInput.classList.toggle('ring-red-500', !yIsCorrect);

            if (!isNaN(xVal) && xIsCorrect) scoreThisRound++;
            if (!isNaN(yVal) && yIsCorrect) scoreThisRound++;
            
            score += scoreThisRound;

            if (round >= TOTAL_ROUNDS) {
                checkButton.classList.add('hidden');
                const validationCode = generateValidationCode(studentName);
                
                if (score === 6) {
                    showFinalScoreModal(
                        `Flawless Victory, ${studentName}!`, 
                        `${getRandomFlawlessCongrats()}`, 
                        score, 
                        validationCode,
                        null // No button for 6/5
                    );
                    launchConfettiBurst(3);
                } else if (score === 5) {
                    showFinalScoreModal(
                        `Perfect Score, ${studentName}!`, 
                        `You finished with 5 out of 5! ${getRandomCongrats()}\nCan you push for a flawless 6/5?`, 
                        score,
                        validationCode,
                        gameOver,
                        'Play Again'
                    );
                    launchConfettiBurst(1);
                    resetButton.classList.remove('hidden');
                } else if (score === 4) {
                    showFinalScoreModal(
                        `Great Job, ${studentName}!`, 
                        `You scored 4 out of 5! Good effort, but a perfect score is 5/5 and the ultimate score is 6/5!`, 
                        score,
                        validationCode,
                        gameOver,
                        'Try Again for 6/5'
                    );
                    resetButton.classList.remove('hidden');
                } else {
                    showFinalScoreModal(
                        `Keep Trying, ${studentName}`, 
                        `You got ${score} out of 5. Review the feedback and try again to reach 5/5 or the flawless 6/5!`, 
                        score,
                        validationCode,
                        gameOver,
                        'Try Again'
                    );
                    resetButton.classList.remove('hidden');
                }
            } else {
                if (scoreThisRound === totalPointsThisRound) {
                    showModal('Perfect!', `Both component values are correct! (+${scoreThisRound} points)`, () => { round++; startRound(); });
                } else {
                    feedback = `Incorrect.\n\n`;
                    feedback += analyzeError(xVal, yVal, originalVector.vx, originalVector.vy, originalVector.magnitude, currentAngleDeg, currentBaseDirection, currentRelativeDirection, currentRelativeAngle);
                    
                    showModal('Not Quite', feedback, () => { round++; startRound(); });
                }
            }
        }
        
        function resetInputs() {
            xInput.value = '';
            yInput.value = '';
            xInput.classList.remove('ring-2', 'ring-green-500', 'ring-red-500');
            yInput.classList.remove('ring-2', 'ring-green-500', 'ring-red-500');
        }

        function gameOver() {
            closeModal();
            checkButton.classList.remove('hidden');
            resetButton.classList.add('hidden');
            startGame();
        }

        function updateUI() {
            scoreEl.textContent = score;
            const roundText = `${round} / ${TOTAL_ROUNDS}`;
            roundEl.textContent = roundText;
        }

        function showFinalScoreModal(title, message, finalScore, validationCode, onButtonClick, buttonText = 'Continue') {
            modalTitleEl.textContent = title;
            modalTitleEl.classList.add('text-green-400');
            modalMessageEl.textContent = message;
            
            const scoreContainer = document.getElementById('finalScoreContainer');
            const scoreDisplay = document.getElementById('finalScoreDisplay');
            const codeDisplay = document.getElementById('validationCode');
            
            scoreContainer.classList.remove('hidden');
            scoreDisplay.textContent = `${finalScore}/5`;
            codeDisplay.textContent = validationCode;

            if (onButtonClick) {
                modalButton.onclick = () => { closeModal(); onButtonClick(); };
                modalButton.textContent = buttonText;
                modalButton.classList.remove('hidden');
            } else {
                // For 6/5, hide buttons
                modalButton.classList.add('hidden');
            }
            modalButtonSecondary.classList.add('hidden');
            
            feedbackModal.classList.remove('hidden');
            setTimeout(() => feedbackModal.querySelector('.modal').classList.remove('scale-95', 'opacity-0'), 10);
        }

        function showModal(title, message, onButtonClick, secondaryOptions = null) {
            modalTitleEl.textContent = title;
            modalTitleEl.className = 'text-4xl font-bold mb-4 cursor-move pb-2 border-b border-gray-700'; // Reset styling
            modalMessageEl.textContent = message;
            
            document.getElementById('finalScoreContainer').classList.add('hidden');

            if (onButtonClick) {
                modalButton.classList.remove('hidden');
                modalButton.onclick = () => { closeModal(); onButtonClick(); };
            }

            if (secondaryOptions) {
                modalButton.textContent = secondaryOptions.primaryText;
                // If there's a secondary, we just repurpose the primary button here as per previous logic, 
                // but if we actually want two buttons, we can show secondary.
                // Keeping it simple based on existing structure.
                modalButtonSecondary.textContent = secondaryOptions.secondaryText || 'Cancel';
                if(secondaryOptions.secondaryText) {
                    modalButtonSecondary.classList.remove('hidden');
                    modalButtonSecondary.onclick = () => { closeModal(); secondaryOptions.onClick(); };
                } else {
                    modalButtonSecondary.classList.add('hidden');
                }
            } else {
                modalButton.textContent = 'Continue';
                modalButtonSecondary.classList.add('hidden');
            }
            
            feedbackModal.classList.remove('hidden');
            setTimeout(() => feedbackModal.querySelector('.modal').classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeModal() {
            const modalContent = feedbackModal.querySelector('.modal');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                feedbackModal.classList.add('hidden');
                 if (!feedbackModal.classList.contains('flex')) {
                   feedbackModal.classList.add('flex', 'items-center', 'justify-center');
                }
                modalContent.style.position = '';
                modalContent.style.top = '';
                modalContent.style.left = '';
            }, 300);
        }

        function getRandomCongrats() {
            return CONGRATS_MESSAGES[Math.floor(Math.random() * CONGRATS_MESSAGES.length)];
        }

        function getRandomFlawlessCongrats() {
            return FLAWLESS_MESSAGES[Math.floor(Math.random() * FLAWLESS_MESSAGES.length)];
        }
        
        function launchConfettiBurst(bursts = 3) {
            let currentBurst = 0;
            // 3 distinct cannons across the screen
            const cannons = [
                { x: '25vw', angleMin: -80, angleMax: -40 },  // Left cannon
                { x: '50vw', angleMin: -110, angleMax: -70 }, // Center cannon
                { x: '75vw', angleMin: -140, angleMax: -100 } // Right cannon
            ];
            
            function fire() {
                const cannon = cannons[currentBurst % cannons.length];
                launchConfetti(cannon.x, cannon.angleMin, cannon.angleMax);
                currentBurst++;
                if (currentBurst < bursts) {
                    setTimeout(fire, 600); // 600ms gap between each cannon burst
                }
            }
            
            fire();
        }

        function launchConfetti(originX = '50vw', angleMin = -120, angleMax = -60) {
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#eab308', '#a855f7', '#06b6d4', '#f97316', '#ec4899'];
            const count = 120; // Particle density per burst
            
            for (let i = 0; i < count; i++) {
                const confetto = document.createElement('div');
                confetto.classList.add('confetti');
                
                // Random launch angle converted to radians
                const angleDeg = angleMin + Math.random() * (angleMax - angleMin);
                const angleRad = (angleDeg * Math.PI) / 180;
                
                // Ballistic initial velocity
                const velocity = Math.random() * 26 + 18; 
                const vx = Math.cos(angleRad) * velocity;
                const vy = Math.sin(angleRad) * velocity; // Upward negative y
                
                const width = Math.random() * 8 + 6;
                const height = Math.random() * 12 + 6;
                const isCircle = Math.random() > 0.6;
                
                confetto.style.left = originX;
                confetto.style.top = '100vh';
                confetto.style.width = `${width}px`;
                confetto.style.height = `${height}px`;
                confetto.style.borderRadius = isCircle ? '50%' : '2px';
                confetto.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetto.style.animation = 'none'; 
                confetto.style.zIndex = '9999';
                document.body.appendChild(confetto);
                
                const rotX = Math.random() * 720 - 360;
                const rotY = Math.random() * 720 - 360;
                const rotZ = Math.random() * 1080 - 540;
                
                // Ballistic arc trajectory animation (launch -> apex -> gravitational drop)
                const anim = confetto.animate([
                    { 
                        transform: `translate(0, 0) rotateX(0deg) rotateY(0deg) rotateZ(0deg) scale(1)`, 
                        opacity: 1 
                    },
                    { 
                        transform: `translate(${vx * 12}px, ${vy * 18}px) rotateX(${rotX * 0.5}deg) rotateY(${rotY * 0.5}deg) rotateZ(${rotZ * 0.5}deg) scale(1.1)`, 
                        opacity: 1, 
                        offset: 0.4 
                    },
                    { 
                        transform: `translate(${vx * 22}px, ${vy * 18 + 700}px) rotateX(${rotX}deg) rotateY(${rotY}deg) rotateZ(${rotZ}deg) scale(0.6)`, 
                        opacity: 0 
                    }
                ], {
                    duration: 2200 + Math.random() * 800,
                    easing: 'cubic-bezier(0.15, 0.85, 0.35, 1)',
                    fill: 'forwards'
                });
                
                anim.onfinish = () => confetto.remove();
            }
        }
        
        function makeDraggable(elmnt, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const dragHandle = handle || elmnt;

            dragHandle.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                const target = e.target || e.srcElement;
                if (target.tagName === 'BUTTON' || target.tagName === 'INPUT') return;
                
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                if (feedbackModal.classList.contains('flex')) {
                    feedbackModal.classList.remove('flex', 'items-center', 'justify-center');
                    elmnt.style.position = 'absolute';
                    const rect = elmnt.getBoundingClientRect();
                    elmnt.style.left = rect.left + 'px';
                    elmnt.style.top = rect.top + 'px';
                }
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }

        window.addEventListener('resize', setupCanvas);
        checkButton.addEventListener('click', checkAnswer);
        resetButton.addEventListener('click', gameOver);

        setupCanvas();
        initGame(); // Replaced startGame with initGame to show start screen
        makeDraggable(feedbackModal.querySelector('.modal'), modalTitleEl);

    </script>
</body>
</html>
