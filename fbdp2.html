<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics: FBD & Force Solver</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } }
        }
    </script>
    <style>
        body { font-family: 'Inter', 'sans-serif'; background-color: #f3f4f6; }
        .canvas-box { background: white; border: 1px solid #e5e7eb; border-radius: 0.75rem; overflow: hidden; position: relative; }
        .algebra-input { font-family: 'Consolas', monospace; font-size: 0.9rem; padding: 0.4rem; border: 2px solid #d1d5db; border-radius: 0.5rem; width: 100%; transition: border-color 0.2s; }
        .algebra-input:focus { outline: none; border-color: #4f46e5; }
        .algebra-input.correct { border-color: #10b981; background-color: #ecfdf5; }
        .btn-primary { background-color: #4f46e5; color: white; font-weight: 600; padding: 0.5rem; border-radius: 0.5rem; transition: background 0.2s; font-size: 0.9rem; }
        .btn-primary:hover { background-color: #4338ca; }
        .btn-primary:disabled { background-color: #9ca3af; cursor: not-allowed; }
        
        .force-btn { background: #eef2ff; color: #3730a3; border: 1px solid #c7d2fe; padding: 0.3rem 0.5rem; border-radius: 0.5rem; font-weight: 600; font-size: 0.8rem; transition: all 0.2s; }
        .force-btn:hover { background: #c7d2fe; }
        .force-btn.selected { background: #4f46e5; color: white; ring: 2px solid #312e81; }
        .force-btn.confirmed { background: #d1fae5; color: #065f46; border-color: #6ee7b7; cursor: default; opacity: 0.7; }

        .dir-btn { 
            background: #f9fafb; border: 1px solid #e5e7eb; padding: 0.1rem; border-radius: 0.375rem; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            height: 100%; width: 100%; transition: all 0.1s; 
            font-size: 1.4rem; font-weight: 900; line-height: 1; color: #1f2937;
        }
        .dir-btn:hover { background: #e5e7eb; border-color: #d1d5db; color: #000; }
        .dir-btn:active { background: #d1d5db; }
        .dir-btn span { font-size: 0.6rem; font-weight: normal; margin-top: 1px; color: #4b5563; } 
        
        .debug-panel { display: none; background: #1f2937; color: #e5e7eb; font-family: 'Consolas', monospace; font-size: 0.8rem; padding: 1rem; border-radius: 0.5rem; margin-top: 1rem; white-space: pre-wrap; word-break: break-all; line-height: 1.4; }
        .eq-display { background: #f8fafc; border-left: 4px solid #4f46e5; padding: 0.25rem 0.5rem; margin-bottom: 0.5rem; font-family: 'Consolas', monospace; color: #334155; font-size: 0.85rem; }
        
        .info-box { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 0.5rem; border-radius: 0.5rem; margin-bottom: 0.75rem; font-size: 0.85rem; }

        /* Confetti Canvas */
        #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-2 sm:p-3">

    <canvas id="confetti-canvas"></canvas>

    <div id="app-container" class="w-full max-w-6xl bg-white shadow-xl rounded-2xl p-3 sm:p-4 border border-gray-200 z-10">

        <div class="flex flex-col md:flex-row justify-between items-center mb-2 pb-2 border-b border-gray-100">
            <div class="mb-1 md:mb-0 text-center md:text-left">
                <h1 class="text-lg sm:text-xl font-bold text-gray-800">Physics: FBD & Force Solver</h1>
                <p class="text-[10px] text-gray-500 mt-0">Session: <span id="session-id">Loading...</span></p>
            </div>
            <div class="flex items-center gap-3 sm:gap-5">
                <div class="bg-green-50 border-2 border-green-500 rounded-xl px-4 py-1 shadow-sm text-center min-w-[100px]">
                    <div class="text-[10px] text-green-800 uppercase tracking-wider font-bold">Current Score</div>
                    <div id="current-score" class="text-2xl font-black text-green-600 leading-none">0/15</div>
                </div>
                
                <!-- Controls (Debug Hidden) -->
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-3 sm:gap-4">

            <div class="flex flex-col gap-2">
                <div class="canvas-box p-2 shadow-sm h-full flex flex-col">
                    <h2 class="text-sm font-bold text-indigo-700 mb-1">Problem Visualization</h2>
                    <div id="problem-description" class="text-gray-700 text-xs mb-1 min-h-[1.5rem]"></div>
                    <div class="flex-grow flex items-center justify-center bg-gray-50 rounded border border-gray-100 overflow-hidden relative">
                        <canvas id="setupCanvas" width="600" height="180" class="w-full h-full object-contain"></canvas>
                    </div>
                </div>
            </div>

            <div class="flex flex-col gap-2">
                <div class="canvas-box p-2 shadow-sm flex flex-col items-center relative">
                    <h2 class="text-sm font-bold text-indigo-700 mb-1 w-full text-left">Free Body Diagram</h2>
                    <canvas id="fbdCanvas" width="400" height="180" class="w-full h-auto object-contain bg-white"></canvas>
                </div>

                <div id="step-container" class="bg-indigo-50 p-3 rounded-xl border border-indigo-100 shadow-sm min-h-[140px] flex flex-col justify-center">
                    <h3 class="text-md font-bold text-indigo-900 animate-pulse">Loading Session...</h3>
                </div>

                <div id="feedback-area" class="hidden p-2 rounded-lg border text-xs transition-all duration-300">
                    <p class="font-bold mb-0.5" id="feedback-title">Feedback:</p>
                    <div id="feedback-text"></div>
                </div>

                <div id="debug-info" class="debug-panel"></div>
            </div>
        </div>
    </div>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        window.firebase = { initializeApp, getAuth, signInAnonymously };
    </script>

    <script>
        let ctxViz, ctxFBD; 
        
        const MAX_SCORE = 15;
        const FORCE_COLORS = { N: '#10b981', T: '#8b5cf6', mg: '#ef4444', fk: '#f97316', Th: '#facc15', P: '#0ea5e9' };
        const FORCE_LABELS = { N: "Normal Force", mg: "Gravity (mg)", fk: "Friction", T: "Tension", Th: "Thrust", P: "Push Force" };

        let state = {
            currentStep: 'intro', currentProblemIndex: -1, currentProblem: null, sessionProblems: [],
            corrections: 0, score: 0, 
            fbdForces: {}, selectedForceName: null, wrongAttempts: 0,
            solvedEqX: "", solvedEqY: "", problemsComplete: 0,
            debugProblemIndex: -1, allDebugProblems: [],
            completedProblemsData: [], 
            p_comp_x: false, p_comp_y: false, p_eq_x: false, p_eq_y: false, p_alg: false
        };
        let DEBUG_MODE = false;

        const generateUniqueMessage = (score) => {
            const adjs = ["Cosmic", "Quantum", "Interstellar", "Galactic", "Newtonian", "Einsteinian", "Supersonic", "Infinite", "Absolute", "Kinetic", "Dynamic", "Orbital", "Hyper", "Mega", "Giga", "Tera", "Peta", "Exa", "Zetta", "Yotta", "Universal", "Stellar", "Atomic", "Nuclear", "Radiant", "Brilliant", "Luminous", "Shattering", "Unstoppable", "Invincible"];
            const nouns = ["Champion", "Mastermind", "Wizard", "Phenom", "Genius", "Titan", "Legend", "Force", "Vector", "Scalar", "Virtuoso", "Prodigy", "Maestro", "Savant", "Oracle", "Architect", "Engineer", "Physicist", "Pioneer", "Voyager", "Conqueror", "Hero", "Guardian", "Brain", "Mind", "Intellect", "Star", "Comet", "Pulsar", "Quasar"];
            const rand = (arr) => arr[Math.floor(Math.random() * arr.length)];
            
            if (score >= 16) { return `UNBELIEVABLE! You have transcended! You are the ${rand(adjs)} ${rand(nouns)} of the Multiverse!`; }
            else if (score === 15) { return `FLAWLESS! You are the ${rand(adjs)} ${rand(nouns)} of Physics!`; }
            else if (score >= 10) { return `Great job! You are a ${rand(adjs)} ${rand(nouns)} in training!`; }
            else { return `Keep practicing to unlock your inner ${rand(nouns)}!`; }
        };

        const baseProblems = [
            { id: "rocket", group: 1, baseTitle: "Rocket Car", baseDesc: "A rocket car moves to the {DIR}. Its thruster pushes down and {DIR} at angle $\\theta$ below horizontal.", type: "push", accelAxis: "x", target: {a:"a_x", f:"N"}, image: "rocket", forces: { N:[0,1], mg:[0,-1] }, varForce: { name:"Th", angDeg:30 }, frictionOpposes: true },
            { id: "bobsled", group: 1, baseTitle: "Bobsled Push", baseDesc: "A bobsled is pushed to the {DIR} across ice. The push force P is directed down and {DIR} at angle $\\theta$ below the horizontal onto the back of the sled.", type: "push", accelAxis: "x", target: {a:"a_x", f:"N"}, image: "bobsled", forces: { N:[0,1], mg:[0,-1] }, varForce: { name:"P", angDeg:30 }, frictionOpposes: true },
            { id: "bathtub", group: 2, baseTitle: "Bathtub on Ice", baseDesc: "A bathtub slides on ice. It is pulled by a rope angled $\\theta$ above the horizontal. It moves to the {DIR}.", type: "pull", accelAxis: "x", target: {a:"a_x", f:"N"}, image: "bathtub", forces: { N:[0,1], mg:[0,-1] }, varForce: { name:"T", angDeg:-30 }, frictionOpposes: true },
            { id: "skater", group: 2, baseTitle: "Kite Skater", baseDesc: "A skater is pulled across ice by a kite string angled $\\theta$ above horizontal. Skater moves {DIR}.", type: "pull", accelAxis: "x", target: {a:"a_x", f:"N"}, image: "skater", forces: { N:[0,1], mg:[0,-1] }, varForce: { name:"T", angDeg:-40 }, frictionOpposes: true },
            { id: "ceiling", group: 3, baseTitle: "Box on Ceiling", baseDesc: "A box is pushed against the ceiling moving {DIR}. A force P acts Up and {DIR} at an angle $\\theta$ from the horizontal.", type: "ceiling", accelAxis: "x", target: {a:"a_x", f:"N"}, image: "ceiling", forces: { N:[0,-1], mg:[0,-1] }, varForce: { name:"P", angDeg:210 }, frictionOpposes: true },
            { id: "batmobile", group: 3, baseTitle: "Batmobile on Wall", baseDesc: "The Batmobile drives {DIR} a vertical wall on the {WALL}, propelled only by the thrust from its jet engine. Thrust (Th) is directed {THRUST_DIR} at angle $\\theta$.", type: "wall", accelAxis: "y", target: {a:"a_y", f:"N"}, image: "batmobile", forces: { mg:[0,1], fk:[0,1] }, varForce: { name:"Th", angDeg:315 }, frictionOpposes: false }
        ];

        function generateProblemBank() {
            let bank = [];
            baseProblems.forEach(p => {
                if (p.type !== "wall") {
                    let v1 = JSON.parse(JSON.stringify(p)); let v2 = JSON.parse(JSON.stringify(p));
                    v1.dir = "Right"; v2.dir = "Left";
                    v1.description = p.baseDesc.replace("{DIR}", "Right").replace("{DIR}", "Right");
                    v2.description = p.baseDesc.replace("{DIR}", "Left").replace("{DIR}", "Left");
                    const getFList = (isRight) => {
                        const fkSign = isRight ? -1 : 1;
                        let list = [{name:"N", axis:"y", sign: p.forces.N[1]}, {name:"mg", axis:"y", sign: p.forces.mg[1]}, {name:"fk", axis:"x", sign: fkSign}];
                        let ang=0, sx=0, sy=0;
                        if(p.id==="ceiling") { if (isRight) { ang = 330; sx=1; sy=1; } else { ang = 210; sx=-1; sy=1; } } 
                        else if(p.id==="rocket" || p.id==="bobsled") { if (isRight) { ang = 30; sx=1; sy=-1; } else { ang = 150; sx=-1; sy=-1; } }
                        else { if (isRight) { ang = 330; sx=1; sy=-1; } else { ang = 210; sx=-1; sy=-1; } }
                        list.push({name:p.varForce.name, axis:"angled", angleDeg: ang, sign:{x:sx, y:sy}});
                        return list;
                    };
                    v1.forcesList = getFList(true); v2.forcesList = getFList(false);
                    const sol = (isRight, angName) => {
                        let eqX = isRight ? `${angName}costheta - fk` : `-${angName}costheta + fk`;
                        let eqY = "", fyStr = "";
                        if(p.id==="bathtub"||p.id==="skater") { eqY = `N + ${angName}sintheta - mg`; fyStr = `${angName}sintheta`; }
                        else if(p.id==="rocket"||p.id==="bobsled") { eqY = `N - mg - ${angName}sintheta`; fyStr = `-${angName}sintheta`; }
                        else if(p.id==="ceiling") { eqY = `${angName}sintheta - N - mg`; fyStr = `${angName}sintheta`; }
                        let fxStr = isRight ? `${angName}costheta` : `-${angName}costheta`;
                        return { Fx_comp: fxStr, Fy_comp: fyStr, FnetX: eqX, targetX: "max", FnetY: eqY, targetY: "0" };
                    };
                    v1.solution = sol(true, p.varForce.name); v2.solution = sol(false, p.varForce.name);
                    bank.push(v1); bank.push(v2);
                } else {
                    let b1 = JSON.parse(JSON.stringify(p)); b1.dir="Up"; b1.wallSide="Right"; b1.description=p.baseDesc.replace("{DIR}","up").replace("{WALL}","right").replace("{THRUST_DIR}","Up and Right (Into Wall)");
                    b1.forcesList=[{name:"N",axis:"x",sign:-1},{name:"mg",axis:"y",sign:-1},{name:"fk",axis:"y",sign:-1},{name:"Th",axis:"angled",angleDeg:315,sign:{x:1,y:1}}];
                    b1.solution={Fx_comp:"Thcostheta",Fy_comp:"Thsintheta",FnetX:"Thcostheta - N",targetX:"0",FnetY:"Thsintheta - mg - fk",targetY:"may"};
                    let b2 = JSON.parse(JSON.stringify(p)); b2.dir="Up"; b2.wallSide="Left"; b2.description=p.baseDesc.replace("{DIR}","up").replace("{WALL}","left").replace("{THRUST_DIR}","Up and Left (Into Wall)");
                    b2.forcesList=[{name:"N",axis:"x",sign:1},{name:"mg",axis:"y",sign:-1},{name:"fk",axis:"y",sign:-1},{name:"Th",axis:"angled",angleDeg:225,sign:{x:-1,y:1}}];
                    b2.solution={Fx_comp:"-Thcostheta",Fy_comp:"Thsintheta",FnetX:"-Thcostheta + N",targetX:"0",FnetY:"Thsintheta - mg - fk",targetY:"may"};
                    let b3 = JSON.parse(JSON.stringify(p)); b3.dir="Down"; b3.wallSide="Right"; b3.description=p.baseDesc.replace("{DIR}","down").replace("{WALL}","right").replace("{THRUST_DIR}","Down and Right (Into Wall)");
                    b3.forcesList=[{name:"N",axis:"x",sign:-1},{name:"mg",axis:"y",sign:-1},{name:"fk",axis:"y",sign:1},{name:"Th",axis:"angled",angleDeg:45,sign:{x:1,y:1}}];
                    b3.solution={Fx_comp:"Thcostheta",Fy_comp:"-Thsintheta",FnetX:"Thcostheta - N",targetX:"0",FnetY:"fk - mg - Thsintheta",targetY:"may"};
                    let b4 = JSON.parse(JSON.stringify(p)); b4.dir="Down"; b4.wallSide="Left"; b4.description=p.baseDesc.replace("{DIR}","down").replace("{WALL}","left").replace("{THRUST_DIR}","Down and Left (Into Wall)");
                    b4.forcesList=[{name:"N",axis:"x",sign:1},{name:"mg",axis:"y",sign:-1},{name:"fk",axis:"y",sign:1},{name:"Th",axis:"angled",angleDeg:135,sign:{x:-1,y:1}}];
                    b4.solution={Fx_comp:"-Thcostheta",Fy_comp:"-Thsintheta",FnetX:"-Thcostheta + N",targetX:"0",FnetY:"fk - mg - Thsintheta",targetY:"may"};
                    bank.push(b1, b2, b3, b4);
                }
            });
            return bank;
        }

        const problemBank = generateProblemBank();

        function shuffle(array) { for (let i = array.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [array[i], array[j]] = [array[j], array[i]]; } }

        window.startSession = function() {
            ctxViz = document.getElementById('setupCanvas').getContext('2d');
            ctxFBD = document.getElementById('fbdCanvas').getContext('2d');
            
            const g1 = problemBank.filter(p => p.group === 1); const g2 = problemBank.filter(p => p.group === 2); const g3 = problemBank.filter(p => p.group === 3);
            const p1 = g1[Math.floor(Math.random() * g1.length)]; const p2 = g2[Math.floor(Math.random() * g2.length)]; const p3 = g3[Math.floor(Math.random() * g3.length)];
            state.sessionProblems = [p1, p2, p3]; shuffle(state.sessionProblems);
            state.currentProblemIndex = -1; state.problemsComplete = 0; state.score = 0; state.corrections = 0; state.completedProblemsData = [];
            loadNextProblem('next');
            document.getElementById('session-id').textContent = Math.random().toString(36).substring(7);
            state.allDebugProblems = problemBank; state.debugProblemIndex = -1; 
        }

        window.loadNextProblem = function(dir) {
            if (state.problemsComplete >= 3) {
                let finalScore = state.score;
                if (state.corrections <= 5) finalScore += 5;
                else if (state.corrections === 6) finalScore += 4;
                else if (state.corrections === 7) finalScore += 3;
                else if (state.corrections === 8) finalScore += 2;
                else if (state.corrections === 9) finalScore += 1;
                if (state.corrections > 20) finalScore -= (state.corrections - 20);
                
                let msg = "", fire = false;
                if (finalScore < 10) msg = `Final Score: ${finalScore}/15. Physics is tough! Give it another try.`;
                else { msg = generateUniqueMessage(finalScore); fire = (finalScore >= 15); }
                
                document.getElementById('current-score').textContent = `${finalScore}/15`;

                document.getElementById('step-container').innerHTML = `
                    <div class="text-center p-5">
                        <h2 class="text-2xl font-bold mb-3 text-indigo-900">Session Complete!</h2>
                        <p class="text-lg mb-4">${msg}</p>
                        <p class="text-6xl font-black text-green-600 mb-4 border-8 border-green-200 inline-block px-6 py-4 rounded-2xl bg-white shadow-lg">
                            ${finalScore}/15<br>
                            <span class="text-sm text-gray-400 font-medium block mt-1">FBD practice 2</span>
                        </p>
                        <p class="text-sm text-gray-500 mb-6">Total Corrections: ${state.corrections}</p>
                        <div class="flex gap-2 justify-center">
                            <button class="btn-primary" onclick="downloadSolutions()">Download Solutions</button>
                            <button class="btn-primary bg-gray-600 hover:bg-gray-700" onclick="startSession()">New Session</button>
                        </div>
                    </div>
                `;
                document.getElementById('problem-description').innerHTML = "";
                if (fire) fireConfetti();
                return;
            }

            const len = state.sessionProblems.length;
            if (dir === 'next') state.currentProblemIndex = (state.currentProblemIndex + 1) % len;
            else if (dir === 'prev') state.currentProblemIndex = (state.currentProblemIndex - 1 + len) % len;
            state.currentProblem = state.sessionProblems[state.currentProblemIndex];
            
            state.currentStep = 'fbd_step_1'; state.fbdForces = {}; state.selectedForceName = null; state.wrongAttempts = 0; state.solvedEqX = ""; state.solvedEqY = "";
            state.p_comp_x = false; state.p_comp_y = false; state.p_eq_x = false; state.p_eq_y = false; state.p_alg = false;
            clearFeedback(); drawViz(); drawFBD(); renderStep(); updateScoreUI();
        }
        
        window.downloadSolutions = function() {
            const data = state.completedProblemsData;
            if (!data || data.length === 0) return;
            
            let htmlContent = `
                <html><head><title>Free Body Diagram Sim part 2 solutions</title><style>
                body { font-family: 'Segoe UI', sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; color: #1f2937; }
                h1 { color: #312e81; border-bottom: 2px solid #e5e7eb; padding-bottom: 10px; }
                .prob { margin-bottom: 40px; background: #f9fafb; padding: 20px; border-radius: 8px; border: 1px solid #e5e7eb; page-break-inside: avoid; }
                .prob h2 { margin-top: 0; color: #374151; font-size: 1.2em; }
                .sect { margin-bottom: 10px; }
                .label { font-weight: bold; color: #4b5563; font-size: 0.9em; }
                .math { font-family: 'Times New Roman', serif; font-style: italic; background: #fff; padding: 2px 6px; border-radius: 4px; border: 1px solid #d1d5db; display: inline-block; }
                .force-list { display: flex; gap: 10px; margin-top: 5px; flex-wrap: wrap; }
                .force-tag { background: #eef2ff; color: #312e81; padding: 2px 8px; border-radius: 4px; font-size: 0.85em; border: 1px solid #c7d2fe; }
                .imgs { display: flex; gap: 20px; margin: 15px 0; justify-content: center; }
                .imgs img { border: 1px solid #ddd; border-radius: 4px; max-width: 45%; background: white; }
                </style></head><body>
                <h1>Free Body Diagram Sim part 2 solutions</h1>
                <p>Final Score: ${document.getElementById('current-score').textContent} (Pre-Bonus/Penalty)</p>
            `;

            data.forEach((d, idx) => {
                const formatMath = (s) => s.replace(/theta/g, '&theta;').replace(/mu/g, '&mu;').replace(/(\w+)_(\w+)/g, '$1<sub>$2</sub>');
                let forcesHtml = d.forces.map(f => `<span class="force-tag">${f.name} (${f.axis === 'angled' ? 'Angled' : f.axis.toUpperCase()})</span>`).join('');
                htmlContent += `
                    <div class="prob">
                        <h2>Problem ${idx + 1}: ${d.title}</h2>
                        <div class="sect"><p>${d.desc}</p></div>
                        <div class="imgs">
                            <img src="${d.imgViz}" alt="Visualization">
                            <img src="${d.imgFBD}" alt="FBD">
                        </div>
                        <div class="sect"><div class="label">1. Free Body Diagram Forces:</div><div class="force-list">${forcesHtml}</div></div>
                        <div class="sect"><div class="label">2. Components of Angled Force (${d.angName}):</div><div>X: <span class="math">${formatMath(d.fx)}</span></div><div>Y: <span class="math">${formatMath(d.fy)}</span></div></div>
                        <div class="sect"><div class="label">3. Newton's 2nd Law Equations:</div><div>X-Axis: <span class="math">${formatMath(d.eqX)} = ${d.targetX}</span></div><div>Y-Axis: <span class="math">${formatMath(d.eqY)} = ${d.targetY}</span></div></div>
                        <div class="sect"><div class="label">4. Solution for Acceleration:</div><div><span class="math">${d.targetA} = (${formatMath(d.algNum)}) / m</span></div></div>
                    </div>
                `;
            });
            htmlContent += `</body></html>`;
            const blob = new Blob([htmlContent], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); a.href = url; a.download = 'Free Body Diagram Sim part 2 solutions.html'; document.body.appendChild(a); a.click(); document.body.removeChild(a);
        };

        window.debugNavigate = function(dir) {

            if (isYCorrect) { if (!state.p_comp_y) { state.score += 0.5; state.p_comp_y = true; } feedback += "Vertical component is Correct! "; document.getElementById('in-fy').classList.add('correct'); } else { feedback += "Vertical component is Incorrect. "; if(clean(fy).replace(/-/g,'') === clean(expectedFy).replace(/-/g,'')) feedback += "Check sign. "; else if(clean(fy).includes('cos') && !clean(expectedFy).includes('cos')) feedback += "Check trig function. "; feedbackError = true; } 
            showFeedback(feedback, feedbackError); updateScoreUI(); 
            if (isXCorrect && isYCorrect) { setTimeout(() => { state.currentStep = 'eqn_x'; state.wrongAttempts = 0; clearFeedback(); renderStep(); }, 1000); } else { state.wrongAttempts++; state.corrections++; if (state.wrongAttempts > 2) { showFeedback(`Correct: X=${expectedFx}, Y=${expectedFy}`, true); } } 
        }
        
        window.checkEquation = (axis) => { const val = document.getElementById('in-fnet').value; if(!val.includes('=')) return showFeedback("Use '=' to write the full equation.", true); const [lhs, rhs] = val.split('='); const p = state.currentProblem; const angName = p.forcesList.find(f=>f.axis==='angled').name; const cLhs = (axis==='x'?p.solution.FnetX:p.solution.FnetY).replace(/(Th|T|P)/g, angName); const cRhs = axis==='x'?p.solution.targetX:p.solution.targetY; const check = checkEqDetails(lhs, cLhs); const isLhsCorrect = !check.termError && !check.signError; const isRhsCorrect = clean(rhs)===clean(cRhs); if(isLhsCorrect && isRhsCorrect) { if (axis==='x' && !state.p_eq_x) { state.score++; state.p_eq_x = true; } if (axis==='y' && !state.p_eq_y) { state.score++; state.p_eq_y = true; } showFeedback("Correct Equation!", false); updateScoreUI(); setTimeout(() => { if(axis==='x') { state.solvedEqX=val; state.currentStep='eqn_y'; } else { state.solvedEqY=val; state.currentStep='solve_accel'; } state.wrongAttempts=0; clearFeedback(); renderStep(); }, 1000); } else { state.wrongAttempts++; state.corrections++; let msg = "Incorrect. "; if (state.wrongAttempts > 2) { msg = `Correct equation: ${cLhs} = ${cRhs}`; } else { if (!isRhsCorrect) msg += cRhs==='0' ? "Check acceleration (is it 0?). " : "Check acceleration term (ma). "; if (check.termError && check.signError) msg += "Check both terms and signs on the left side."; else if (check.termError) msg += "Check the forces included (terms)."; else if (check.signError) msg += "Check your signs (+/-)."; } showFeedback(msg, true); } }
        window.checkAlgebra = () => {
            let val = document.getElementById('in-solve').value;
            const p = state.currentProblem;
            const angName = p.forcesList.find(f=>f.axis==='angled').name;
            const axis = p.target.a.endsWith('x') ? 'x' : 'y';
            const fnetStr = (axis === 'x' ? p.solution.FnetX : p.solution.FnetY).replace(/(Th|T|P)/g, angName);
            
            let expression = val;
            if (val.includes('=')) { const parts = val.split('='); if (clean(parts[0]).startsWith('a')) expression = parts[1]; else expression = parts[0]; }

            if (!expression.includes('/')) return showFeedback("Incorrect. Remember to divide by mass.", true);
            const parts = expression.split('/');
            const num = parts[0];
            const den = parts[1];
            if (clean(den) !== 'm') return showFeedback("Incorrect denominator.", true);
            
            let cleanNum = num.trim();
            if (cleanNum.startsWith('(') && cleanNum.endsWith(')')) cleanNum = cleanNum.substring(1, cleanNum.length - 1);
            
            const check = checkEqDetails(cleanNum, fnetStr);
            
            if (!check.termError && !check.signError) {
                if (!state.p_alg) { state.score++; state.p_alg = true; }
                
                // SNAPSHOT DATA FOR DOWNLOAD
                const vizImg = document.getElementById('setupCanvas').toDataURL();
                const fbdImg = document.getElementById('fbdCanvas').toDataURL();
                state.completedProblemsData.push({
                    id: p.id,
                    title: p.baseTitle,
                    desc: p.description,
                    forces: p.forcesList,
                    angName: angName,
                    fx: (p.solution.Fx_comp).replace(/(Th|T|P)/g, angName),
                    fy: (p.solution.Fy_comp).replace(/(Th|T|P)/g, angName),
                    eqX: (p.solution.FnetX).replace(/(Th|T|P)/g, angName),
                    eqY: (p.solution.FnetY).replace(/(Th|T|P)/g, angName),
                    targetX: p.solution.targetX,
                    targetY: p.solution.targetY,
                    targetA: p.target.a,
                    algNum: fnetStr,
                    imgViz: vizImg,
                    imgFBD: fbdImg
                });
                
                state.problemsComplete++; updateScoreUI(); state.currentStep='complete'; if(state.score >= 15) fireConfetti(); renderStep(); loadNextProblem('next');
            } else {
                state.wrongAttempts++; state.corrections++; let msg = "Incorrect numerator. "; if (state.wrongAttempts > 2) { msg = `Correct algebra: ${p.target.a} = (${fnetStr}) / m`; } else { if(check.termError) msg += "Check terms."; if(check.signError) msg += "Check signs."; } showFeedback(msg, true);
            }
        }

        function handleFailure(h) { state.wrongAttempts++; showFeedback(`${h}`, true); }
        function showFeedback(m,e) { const el = document.getElementById('feedback-area'); document.getElementById('feedback-text').innerHTML = m; el.style.display='block'; el.className = `p-3 rounded-lg border text-sm ${e?'bg-red-50 border-red-200 text-red-700':'bg-green-50 border-green-200 text-green-700'}`; }
        function clearFeedback() { document.getElementById('feedback-area').style.display='none'; }
        window.onload = startSession;
    </script>
</body>
