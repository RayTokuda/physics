        function setupCanvas() {
            if (!gameContainer) return;
            const rect = gameContainer.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            draw();
        }

        function startGame() {
            score = 0;
            round = 1;
            level = 1;
            updateUI();
            startRound();
        }

        function generateVectors(count) {
            vectors = [];
            const colors = ['#3b82f6', '#f59e0b', '#10b981', '#8b5cf6', '#ec4899'];
            const margin = 80;
            const availWidth = Math.max(200, canvas.width - margin * 2);
            const availHeight = Math.max(200, canvas.height - margin * 2);

            for (let i = 0; i < count; i++) {
                let dx = (Math.random() * 120 - 60);
                let dy = (Math.random() * 120 - 60);
                if (Math.hypot(dx, dy) < 40) {
                    dx = dx >= 0 ? 50 : -50;
                    dy = dy >= 0 ? 50 : -50;
                }

                const x = margin + Math.random() * Math.max(20, availWidth - Math.abs(dx));
                const y = margin + Math.random() * Math.max(20, availHeight - Math.abs(dy));

                vectors.push({
                    id: i,
                    x: x,
                    y: y,
                    dx: dx,
                    dy: dy,
                    color: colors[i % colors.length]
                });
            }
        }

        function startRound() {
            gameState = 'placing_vectors';
            vectorsPlacedCorrectly = false;
            userResultant = null;
            isDrawingResultant = false;
            checkButton.disabled = true;
            checkButton.textContent = 'Check Placement';
            secondaryButton.textContent = 'Reset Vectors';
            
            instructionsEl.className = 'text-center bg-gray-700/50 p-3 sm:p-4 rounded-xl mb-3 sm:mb-4 text-gray-200 shadow-inner border border-gray-600/50 text-sm sm:text-base font-medium transition-all duration-300';
            instructionsEl.textContent = 'Drag the vectors to place them tip-to-tail. The order doesn\'t matter!';
            canvas.style.cursor = 'default';

            const vectorCount = level === 1 ? 2 : 3;
            generateVectors(vectorCount);
            draw();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Subtle grid
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 1;
            const gridSize = 30;
            for (let x = 0; x < canvas.width; x += gridSize) {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();
            }
            for (let y = 0; y < canvas.height; y += gridSize) {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw component vectors
            vectors.forEach(v => drawVector(v, false));

            // Draw user resultant if present
            if (userResultant) {
                drawVector(userResultant, true);
            }
        }

        function drawVector(vector, isThick = false) {
            const drawColor = (vectorsPlacedCorrectly && !isThick) ? '#22c55e' : vector.color;

            ctx.strokeStyle = drawColor;
            ctx.fillStyle = drawColor;
            ctx.lineWidth = isThick ? 6 : 4;

            const headlen = isThick ? 14 : 12;
            const angle = Math.atan2(vector.dy, vector.dx);

            // Line
            ctx.beginPath();
            ctx.moveTo(vector.x, vector.y);
            ctx.lineTo(vector.x + vector.dx, vector.y + vector.dy);
            ctx.stroke();
            
            // Arrowhead
            ctx.beginPath();
            ctx.moveTo(vector.x + vector.dx, vector.y + vector.dy);
            ctx.lineTo(vector.x + vector.dx - headlen * Math.cos(angle - Math.PI / 6), vector.y + vector.dy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(vector.x + vector.dx - headlen * Math.cos(angle + Math.PI / 6), vector.y + vector.dy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath();
            ctx.fill();
            
            // Tail joint
            ctx.beginPath();
            ctx.arc(vector.x, vector.y, 4, 0, 2 * Math.PI);
            ctx.fill();
        }

            const name = playerNameInput.value.trim();
            if (name.length > 0) {
                playerName = name;
                sessionVerificationCode = generateVerificationCode(playerName);

            let msgList;
            if (type === 5) {
                msgList = PERFECT_5_MESSAGES;
            } else if (type === 6) {
                msgList = PERFECT_6_MESSAGES;
            } else {
                return `Great job, ${playerName}!`;
            }
            const randIndex = Math.floor(Math.random() * msgList.length);
            return msgList[randIndex].replace(/<NAME>/g, playerName);
        }

        function generateVerificationCode(name) {
            if (!name) return "";
            const cleanName = name.replace(/[^a-zA-Z]/g, '').toUpperCase();
            const letters = (cleanName + 'XXX').substring(0, 3).split('');
            
            const chars = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            const codeLength = 9;
            
            const indices = [];
            while (indices.length < 3) {
                const randIndex = Math.floor(Math.random() * codeLength);
                if (!indices.includes(randIndex)) {
                    indices.push(randIndex);
                }
            }
            indices.sort((a, b) => a - b);
            
            const result = new Array(codeLength);
            result[indices[0]] = letters[0];
            result[indices[1]] = letters[1];
            result[indices[2]] = letters[2];
            
            for (let i = 0; i < codeLength; i++) {
                if (!result[i]) {
                    result[i] = chars.charAt(Math.floor(Math.random() * chars.length));
                }
            }
            
            return result.join('');
        }

        function updateUI() {
            scoreEl.textContent = score;
            const totalRounds = level === 1 ? 5 : 1;
            const currentRound = level === 1 ? round : 1;
            const roundText = level === 1 ? `${currentRound} / ${totalRounds}` : "Bonus Round!";
            roundEl.textContent = roundText;
            
            if (!sessionVerificationCode && playerName) {
                sessionVerificationCode = generateVerificationCode(playerName);
            }
        }
        
        function getMousePos(evt) {
            const rect = canvas.getBoundingClientRect();
            let clientX, clientY;
            if (evt.touches && evt.touches.length > 0) {
                clientX = evt.touches[0].clientX;
                clientY = evt.touches[0].clientY;
            } else if (evt.changedTouches && evt.changedTouches.length > 0) {
                clientX = evt.changedTouches[0].clientX;
                clientY = evt.changedTouches[0].clientY;
            } else {
                clientX = evt.clientX;
                clientY = evt.clientY;
            }
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function onDown(evt) {
            if(evt.type.includes('touch')) evt.preventDefault();
            const pos = getMousePos(evt);

            if (gameState === 'placing_vectors') {
                for (let i = vectors.length - 1; i >= 0; i--) {
                    const v = vectors[i];
                    const distToTail = Math.hypot(pos.x - v.x, pos.y - v.y);
                    const distToTip = Math.hypot(pos.x - (v.x + v.dx), pos.y - (v.y + v.dy));
                    if (distToTail < HOVER_TOLERANCE || distToTip < HOVER_TOLERANCE) {
                        draggingVector = v;
                        dragOffsetX = pos.x - v.x;
                        dragOffsetY = pos.y - v.y;
                        canvas.style.cursor = 'grabbing';
                        return;
                    }
                }
            } else if (gameState === 'drawing_resultant') {
                userResultant = {
                    x: pos.x,
                    y: pos.y,
                    dx: 0,
                    dy: 0,
                    color: '#ec4899'
                };
                isDrawingResultant = true;
            }
        }
        
        function onMove(evt) {
            if(evt.type.includes('touch')) evt.preventDefault();
            const pos = getMousePos(evt);

            if (gameState === 'placing_vectors') {
                if (draggingVector) {
                    draggingVector.x = pos.x - dragOffsetX;
                    draggingVector.y = pos.y - dragOffsetY;
                    
                    vectors.forEach(v => {
                        if (v.id === draggingVector.id) return;
                        
                        if (Math.hypot((v.x + v.dx) - draggingVector.x, (v.y + v.dy) - draggingVector.y) < SNAP_TOLERANCE) {
                             draggingVector.x = v.x + v.dx;
                             draggingVector.y = v.y + v.dy;
                        }
                        if (Math.hypot(v.x - (draggingVector.x + draggingVector.dx), v.y - (draggingVector.y + draggingVector.dy)) < SNAP_TOLERANCE) {
                             draggingVector.x = v.x - draggingVector.dx;
                             draggingVector.y = v.y - draggingVector.dy;
                        }
                    });
                    canvas.style.cursor = 'grabbing';
                    draw();
                } else {
                    let isHovering = false;
                    for (let i = 0; i < vectors.length; i++) {
                        const v = vectors[i];
                        const distToTail = Math.hypot(pos.x - v.x, pos.y - v.y);
                        const distToTip = Math.hypot(pos.x - (v.x + v.dx), pos.y - (v.y + v.dy));
                        if (distToTail < HOVER_TOLERANCE || distToTip < HOVER_TOLERANCE) {
                            isHovering = true;
                            break;
                        }
                    }
                    canvas.style.cursor = isHovering ? 'grab' : 'default';
                }
            } else if (gameState === 'drawing_resultant') {
                if (isDrawingResultant) {
                    userResultant.dx = pos.x - userResultant.x;
                    userResultant.dy = pos.y - userResultant.y;
                    draw();
                }
            }
        }

        function onUp(evt) {
            if (gameState === 'placing_vectors' && draggingVector) {
                draggingVector = null;
                const pos = getMousePos(evt);
                let isHovering = false;
                for (let i = 0; i < vectors.length; i++) {
                    const v = vectors[i];
                    if (Math.hypot(pos.x - v.x, pos.y - v.y) < HOVER_TOLERANCE || Math.hypot(pos.x - (v.x + v.dx), pos.y - (v.y + v.dy)) < HOVER_TOLERANCE) {
                        isHovering = true; break;
                    }
                }
                canvas.style.cursor = isHovering ? 'grab' : 'default';
                checkVectorsPlacement();
            } else if (gameState === 'drawing_resultant' && isDrawingResultant) {
                isDrawingResultant = false;
                if (userResultant) {
                    checkButton.disabled = false;
                }
            }
        }

        function checkVectorsPlacement() {
            let connections = 0;
            for (let i = 0; i < vectors.length; i++) {
                for (let j = 0; j < vectors.length; j++) {
                    if (i === j) continue;
                    const v1 = vectors[i];
                    const v2 = vectors[j];
                    if (Math.hypot((v1.x + v1.dx) - v2.x, (v1.y + v1.dy) - v2.y) < SNAP_TOLERANCE) {
                        connections++;
                    }
                }
            }
            if (connections >= vectors.length - 1) {
                checkButton.disabled = false;
            } else {
                checkButton.disabled = true;
            }
        }
        
        function handleCheckButtonClick() {
            if (gameState === 'placing_vectors') {
                gameState = 'drawing_resultant';
                vectorsPlacedCorrectly = true;
                checkButton.disabled = true;
                checkButton.textContent = 'Check Resultant';
                secondaryButton.textContent = 'Erase Resultant';
                
                instructionsEl.className = 'text-center bg-emerald-900/60 border border-emerald-500/80 p-3 sm:p-4 rounded-xl mb-3 sm:mb-4 text-emerald-200 shadow-lg shadow-emerald-950/40 text-sm sm:text-base font-semibold transition-all duration-300';
                instructionsEl.textContent = '✓ Correct Placement! Now draw the resultant vector from the first tail to the final tip.';
                canvas.style.cursor = 'crosshair';
                draw();
            } else if (gameState === 'drawing_resultant') {
                if (!userResultant) return;
                checkResultant();
            }
        }
        
        function handleSecondaryButtonClick() {
            if (secondaryButton.textContent === 'Erase Resultant') {
                userResultant = null;
                isDrawingResultant = false;
                checkButton.disabled = true;
                draw();
            } else {
                startRound();
            }
        }

        function checkResultant() {
            if (!userResultant) return;

            let startVector = null;
            let endVector = null;

            vectors.forEach(v => {
                let isTailConnected = false;
                let isTipConnected = false;
                vectors.forEach(otherV => {
                    if (v.id === otherV.id) return;
                    if (Math.hypot(v.x - (otherV.x + otherV.dx), v.y - (otherV.y + otherV.dy)) < SNAP_TOLERANCE) isTailConnected = true;
                    if (Math.hypot((v.x + v.dx) - otherV.x, (v.y + v.dy) - otherV.y) < SNAP_TOLERANCE) isTipConnected = true;
                });
                if (!isTailConnected) startVector = v;
                if (!isTipConnected) endVector = v;
            });
            
            if (!startVector || !endVector) {
                 const isNearZero = Math.hypot(userResultant.dx, userResultant.dy) < SNAP_TOLERANCE;
                 const isNearTail = vectors.some(v => Math.hypot(userResultant.x - v.x, userResultant.y - v.y) < SNAP_TOLERANCE);
                 if (isNearZero && isNearTail) correctAnswer(); else incorrectAnswer();
                 return;
            }

            const correctStartX = startVector.x;
            const correctStartY = startVector.y;
            const correctEndX = endVector.x + endVector.dx;
            const correctEndY = endVector.y + endVector.dy;

            const startPointCorrect = Math.hypot(userResultant.x - correctStartX, userResultant.y - correctStartY) < SNAP_TOLERANCE;
            const endPointCorrect = Math.hypot((userResultant.x + userResultant.dx) - correctEndX, (userResultant.y + userResultant.dy) - correctEndY) < SNAP_TOLERANCE;

            if (startPointCorrect && endPointCorrect) {
                correctAnswer();
            } else {
                incorrectAnswer();
            }
        }
        
        function handleEndGameSummary() {
            if (score === 5) {
                showModal('Amazing!', `You finished with a perfect score of 5 out of 5! ${getRandomMessage(5)}`, gameOver, null, 'Try Again', true);
                launchBallisticConfettiBursts(2);
            } else if (score === 4) {
                showModal('Great Job!', `You scored ${score}/5. Just one point shy of perfect, ${playerName}! Well done!`, gameOver, null, 'Try Again', true);
            } else if (score <= 3) {
                showModal('Keep Practicing!', `You scored ${score}/5, ${playerName}. Physics takes time and practice. Would you like to try again?`, gameOver, null, 'Try Again', true);
            } else {
                showModal('Game Over', `You finished with a score of ${score}/5. Well done, ${playerName}!`, gameOver, null, 'Try Again', true);
            }
        }

        function correctAnswer() {
            score++;
            updateUI();
            
            if (level === 1 && round === 5 && score === 5) {
                showModal(
                    'Perfect Score!', 
                    `Amazing job, ${playerName}! You got 5/5! ${getRandomMessage(5)} Do you want to try a tougher bonus round for a chance to score 6/5?`, 
                    () => { 
                        level = 2; round = 1; updateUI(); startRound();
                    },
                    { 
                        primaryText: 'Challenge Me!',
                        secondaryText: 'No Thanks',
                        onClick: () => { 
                            showModal('Congratulations!', `You finished with a perfect score of 5 out of 5! ${getRandomMessage(5)}`, gameOver, null, 'Try Again', true);
                            launchBallisticConfettiBursts(2);
                        }
                    }
                );
            } else if (level === 2 && round === 1 && score === 6) {
                showModal('6/5 - GOD TIER!', getRandomMessage(6), gameOver, null, 'Try Again', true);
                launchBallisticConfettiBursts(3);
            } else if (round >= 5 && level === 1) {
                handleEndGameSummary();
            } else {
                round++;
                updateUI();
                showModal('Correct!', 'Spot on! Get ready for the next round.', startRound);
            }
        }

        function incorrectAnswer() {
            if (level === 2) {
                showModal('So Close!', `You didn't get the bonus, but you still finished with a perfect score of 5 out of 5, ${playerName}!`, gameOver, null, 'Try Again', true);
                launchBallisticConfettiBursts(2);
            } else {
                 if (round >= 5) {
                    handleEndGameSummary();
                } else {
                    round++;
                    updateUI();
                    showModal('Not Quite!', `That wasn\'t the correct resultant vector. Don't worry ${playerName}, let's try the next round.`, startRound);
                }
            }
        }
        
        function gameOver() {
            startGame();
            closeModal();
        }
        
        function showModal(title, message, onButtonClick, secondaryOptions = null, primaryButtonText = null, showCode = false) {
            modalTitleEl.textContent = title;
            modalMessageEl.textContent = message;
            
            if (showCode && sessionVerificationCode) {
                modalVerificationCodeEl.textContent = `Verification Code: ${sessionVerificationCode}`;
                modalVerificationCodeEl.classList.remove('hidden');
            } else {
                modalVerificationCodeEl.classList.add('hidden');
            }

            modalButton.onclick = () => {
                closeModal();
                onButtonClick();
            };

            if (secondaryOptions) {
                modalButton.textContent = secondaryOptions.primaryText || 'Yes';
                modalButtonSecondary.textContent = secondaryOptions.secondaryText || 'No';
                modalButtonSecondary.classList.remove('hidden');
                modalButtonSecondary.onclick = () => {
                    closeModal();
                    secondaryOptions.onClick();
                };
            } else {
                modalButton.textContent = primaryButtonText || 'Continue';
                modalButtonSecondary.classList.add('hidden');
            }
            
            feedbackModal.classList.remove('hidden');
            
            setTimeout(() => {
                feedbackModal.querySelector('.modal').classList.remove('scale-95', 'opacity-0');
            }, 10);
        }

        function closeModal() {
            feedbackModal.querySelector('.modal').classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                feedbackModal.classList.add('hidden');
            }, 300);
        }

        function resizeConfettiCanvas() {
            if (!confettiCanvas) return;
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }

        function launchSingleBallisticBurst(originXRatio, angleDegrees, spreadDegrees) {
            if (!confettiCanvas || !confettiCtx) return;
            resizeConfettiCanvas();
            confettiCanvas.classList.remove('hidden');
            
            const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6', '#38bdf8', '#facc15'];
            const particleCount = 80;
            const originX = window.innerWidth * originXRatio;
            const originY = window.innerHeight;

            for (let i = 0; i < particleCount; i++) {
                const rad = ((angleDegrees + (Math.random() - 0.5) * spreadDegrees) * Math.PI) / 180;
                const speed = Math.random() * 16 + 14;
                confettiParticles.push({
                    x: originX,
                    y: originY,
                    vx: Math.cos(rad) * speed,
                    vy: Math.sin(rad) * speed,
                    gravity: 0.45,
                    drag: 0.98,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 9 + 6,
                    rotation: Math.random() * Math.PI * 2,
                    vRot: (Math.random() - 0.5) * 0.3,
                    shape: Math.random() > 0.4 ? 'rect' : 'circle',
                    alpha: 1
                });
            }

            if (!confettiAnimationId) {
                animateConfetti();
            }
        }

        function launchBallisticConfettiBursts(burstCount) {
            if (burstCount === 2) {
                launchSingleBallisticBurst(0.2, -65, 35);
                setTimeout(() => {
                    launchSingleBallisticBurst(0.8, -115, 35);
                }, 300);
            } else if (burstCount === 3) {
                launchSingleBallisticBurst(0.15, -60, 35);
                setTimeout(() => {
                    launchSingleBallisticBurst(0.85, -120, 35);
                }, 250);
                setTimeout(() => {
                    launchSingleBallisticBurst(0.5, -90, 65);
                }, 500);
            }
        }

        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            
            for (let i = confettiParticles.length - 1; i >= 0; i--) {
                const p = confettiParticles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += p.gravity;
                p.vx *= p.drag;
                p.vy *= p.drag;
                p.rotation += p.vRot;
                
                if (p.y > window.innerHeight - 80) {
                    p.alpha -= 0.02;
                }

                if (p.alpha <= 0 || p.y > window.innerHeight + 50) {
                    confettiParticles.splice(i, 1);
                    continue;
                }

                confettiCtx.save();
                confettiCtx.globalAlpha = Math.max(0, p.alpha);
                confettiCtx.translate(p.x, p.y);
                confettiCtx.rotate(p.rotation);
                confettiCtx.fillStyle = p.color;

                if (p.shape === 'rect') {
                    confettiCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
                } else {
                    confettiCtx.beginPath();
                    confettiCtx.arc(0, 0, p.size / 2, 0, Math.PI * 2);
                    confettiCtx.fill();
                }
                confettiCtx.restore();
            }

            if (confettiParticles.length > 0) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            } else {
                confettiAnimationId = null;
                confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
                confettiCanvas.classList.add('hidden');
            }
        }

        window.addEventListener('resize', () => {
            setupCanvas();
            resizeConfettiCanvas();
        });
        
        // Input Listeners
        canvas.addEventListener('mousedown', onDown);
        canvas.addEventListener('mousemove', onMove);
        canvas.addEventListener('mouseup', onUp);
        canvas.addEventListener('mouseleave', (e) => { 
             if (draggingVector || isDrawingResultant) onUp(e);
        });

        canvas.addEventListener('touchstart', onDown, {passive: false});
        canvas.addEventListener('touchmove', onMove, {passive: false});
        canvas.addEventListener('touchend', onUp, {passive: false});
        canvas.addEventListener('touchcancel', onUp, {passive: false});

        checkButton.addEventListener('click', handleCheckButtonClick);
        secondaryButton.addEventListener('click', handleSecondaryButtonClick);

        window.onload = function() {
            setupCanvas();
        };
        setupCanvas();
    </script>
</body>
</html>
