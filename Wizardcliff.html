<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Earth Wizard Physics Simulator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #1e1e24; color: #f5f5f5; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { background: #2b2b36; padding: 30px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 800px; width: 100%; position: relative; }
        h1 { color: #4caf50; text-align: center; }
        .problem-text { font-size: 1.1em; line-height: 1.6; background: #383845; padding: 20px; border-radius: 8px; border-left: 5px solid #4caf50; margin-bottom: 20px; }
        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px; }
        .input-group { display: flex; flex-direction: column; }
        label { margin-bottom: 5px; font-weight: bold; color: #a5a5b0; }
        input[type="number"] { padding: 10px; border-radius: 5px; border: 1px solid #555; background: #1e1e24; color: #fff; font-size: 1em; }
        .buttons { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-bottom: 20px; }
        button { padding: 10px 16px; font-size: 0.95em; font-weight: bold; border: none; border-radius: 5px; cursor: pointer; transition: 0.2s; }
        button.primary { background: #4caf50; color: white; }
        button.primary:hover { background: #45a049; }
        button.secondary { background: #2196f3; color: white; }
        button.secondary:hover { background: #1976d2; }
        button.accent { background: #9c27b0; color: white; }
        button.accent:hover { background: #7b1fa2; }
        canvas { background: #87CEEB; border-radius: 8px; width: 100%; max-width: 800px; height: 400px; display: block; border: 2px solid #555; }
        
        /* Updated Win Screen CSS for Fullscreen bulletproof display */
        #winScreen { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
        .win-content { z-index: 10001; text-align: center; background: rgba(43, 43, 54, 0.9); padding: 40px; border-radius: 15px; border: 2px solid #4caf50; box-shadow: 0 0 50px rgba(76, 175, 80, 0.4); }
        .win-content h2 { color: #ffd700; font-size: 3em; margin: 0 0 10px 0; text-shadow: 0 0 20px #ffaa00; }
        .win-content p { color: #fff; font-size: 1.2em; margin-bottom: 25px; }
        canvas#confettiCanvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10000; }
    </style>
</head>
<body>

<div class="container">
    <h1>🧙‍♂️ Wizard Kinematics Simulator</h1>
    
    <div class="problem-text" id="problemText">
        Loading problem...
    </div>

    <div class="inputs">
        <div class="input-group">
            <label>a) Max height of wizard (m):</label>
            <input type="number" id="ansA" step="0.01">
        </div>
        <div class="input-group">
            <label>b) Time in air before landing (s):</label>
            <input type="number" id="ansB" step="0.01">
        </div>
        <div class="input-group">
            <label>c) Time of catch (s):</label>
            <input type="number" id="ansC" step="0.01">
        </div>
        <div class="input-group">
            <label>d) Height of catch (m):</label>
            <input type="number" id="ansD" step="0.01">
        </div>
    </div>

    <div class="buttons">
        <button class="primary" onclick="checkAnswers()">Check Answers</button>
        <button class="secondary" onclick="playAnimation(false)">Play: Catch & Stop</button>
        <button class="accent" onclick="playAnimation(true)">Play: Catch & Land</button>
        <button class="secondary" onclick="generateProblem()">New Variation</button>
    </div>

    <canvas id="simCanvas" width="800" height="400"></canvas>
</div>

<!-- Win Screen moved outside the container to be true fullscreen -->
<div id="winScreen">
    <canvas id="confettiCanvas"></canvas>
    <div class="win-content">
        <h2>MAGIC MASTERED!</h2>
        <p>You successfully caught the magic sword!</p>
        <button class="primary" onclick="generateProblem()" style="font-size: 1.2em; padding: 12px 24px;">Play Again</button>
    </div>
</div>

<script>
    const g = 9.8; 
    let currentParams = {};
    let currentAnswers = {};
    let animationId = null;

    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const scale = 3.5; 

    const confettiCanvas = document.getElementById('confettiCanvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let particles = [];
    let confettiAnimationId = null;

    function generateProblem() {
        // Reset Win Screen
        document.getElementById('winScreen').style.display = 'none';
        if(confettiAnimationId) {
            cancelAnimationFrame(confettiAnimationId);
            confettiAnimationId = null;
        }

        // Clear Inputs
        ['ansA', 'ansB', 'ansC', 'ansD'].forEach(id => {
            let el = document.getElementById(id);
            el.value = '';
            el.style.borderColor = "#555";
            el.style.backgroundColor = "#1e1e24";
        });

        let valid = false;
        let yw0, ys0, vw0, vs;
        let t1, t2, catchHeight, tLand;
        let attempts = 0;

        while(!valid && attempts < 500) {
            attempts++;
            yw0 = Math.floor(Math.random() * 15) + 20; 
            ys0 = yw0 + Math.floor(Math.random() * 10) + 8; 
            vw0 = (Math.random() * 8 + 12).toFixed(1) * 1; 
            vs = -(Math.random() * 4 + 6).toFixed(1) * 1; 

            let A = 0.5 * g;
            let B = vs - vw0;
            let C = ys0 - yw0;
            let discriminant = B*B - 4*A*C;
            
            if(discriminant > 0) {
                t1 = (-B - Math.sqrt(discriminant)) / (2*A);
                t2 = (-B + Math.sqrt(discriminant)) / (2*A);
                tLand = (vw0 + Math.sqrt(vw0 * vw0 + 2 * g * yw0)) / g;

                if(t1 > 0 && t2 > 0 && t2 < tLand) {
                    let v_wizard_at_t2 = vw0 - g * t2;
                    catchHeight = ys0 + vs * t2;

                    if(v_wizard_at_t2 < 0 && catchHeight > 0) {
                        valid = true;
                    }
                }
            }
        }

        if (!valid) {
            yw0 = 28.0; ys0 = 40.0; vw0 = 12.6; vs = -8.4;
            t1 = 0.679; t2 = 3.607;
            catchHeight = ys0 + vs * t2;
            tLand = (vw0 + Math.sqrt(vw0 * vw0 + 2 * g * yw0)) / g;
        }

        currentParams = { yw0, ys0, vw0, vs, t1, t2, catchHeight, tLand };
        
        currentAnswers = {
            a: yw0 + (vw0 * vw0) / (2 * g),
            b: tLand,
            c: t2,
            d: catchHeight
        };

        document.getElementById('problemText').innerHTML = 
            `An earth wizard on a <strong>${yw0.toFixed(1)} m</strong> tall cliff sees a sword <strong>${ys0.toFixed(1)} m</strong> off the ground and instantly jumps up and off the cliff with a velocity of <strong>+${vw0.toFixed(1)} m/s</strong> to try to catch it. The sword is moving downwards with a constant velocity of <strong>${vs.toFixed(1)} m/s</strong> since it is a magic sword. (Wizards are magically impervious to air resistance but still have to obey the law of gravity, g = 9.8 m/s²).<br><br>
            <strong>a)</strong> How high off the ground does the wizard get?<br>
            <strong>b)</strong> How long will the wizard be in the air before landing on the ground?<br><br>
            The wizard misses the sword on the way up (at t = ${currentParams.t1.toFixed(2)}s) but catches the sword on the way down.<br>
            <strong>c)</strong> How long after the wizard jumps does the catch occur?<br>
            <strong>d)</strong> How high off the ground does the catch occur?`;
        
        drawStaticScene();
    }

    function checkAnswers() {
        let a = parseFloat(document.getElementById('ansA').value);
        let b = parseFloat(document.getElementById('ansB').value);
        let c = parseFloat(document.getElementById('ansC').value);
        let d = parseFloat(document.getElementById('ansD').value);

        let correct = 0;
        correct += validateInput('ansA', a, currentAnswers.a);
        correct += validateInput('ansB', b, currentAnswers.b);
        correct += validateInput('ansC', c, currentAnswers.c);
        correct += validateInput('ansD', d, currentAnswers.d);

        if(correct === 4) triggerWin();
    }

    function validateInput(id, userVal, trueVal) {
        let el = document.getElementById(id);
        if(!isNaN(userVal) && Math.abs(userVal - trueVal) / trueVal < 0.015) {
            el.style.borderColor = "#4caf50";
            el.style.backgroundColor = "#2e3b32";
            return 1;
        } else {
            el.style.borderColor = "#f44336";
            el.style.backgroundColor = "#3b2e2e";
            return 0;
        }
    }

    function getYPixel(meters) {
        return canvas.height - 20 - (meters * scale);
    }

    function drawStaticScene() {
        if(animationId) cancelAnimationFrame(animationId);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.fillStyle = '#228B22';
        ctx.fillRect(0, canvas.height - 20, canvas.width, 20);

        ctx.fillStyle = '#555';
        ctx.fillRect(0, getYPixel(currentParams.yw0), 100, currentParams.yw0 * scale);
        
        drawWizard(100, currentParams.yw0);
        drawSword(140, currentParams.ys0);
    }

    function drawWizard(x, y_meters) {
        let px = x;
        let py = getYPixel(y_meters);
        ctx.fillStyle = '#FFD700'; 
        ctx.beginPath();
        ctx.arc(px, py - 10, 8, 0, Math.PI * 2); 
        ctx.fill();
        ctx.fillRect(px - 5, py - 5, 10, 15); 
    }

    function drawSword(x, y_meters) {
        let px = x;
        let py = getYPixel(y_meters);
        ctx.fillStyle = '#C0C0C0';
        ctx.fillRect(px - 2, py - 15, 4, 30); 
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(px - 6, py - 2, 12, 4); 
    }

    function playAnimation(continueToGround) {
        if(animationId) cancelAnimationFrame(animationId);
        let startTime = performance.now();
        let targetTime = continueToGround ? currentParams.tLand : currentParams.t2;

        function step(time) {
            let t = (time - startTime) / 1000;
            if(t > targetTime) t = targetTime;

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#228B22';
            ctx.fillRect(0, canvas.height - 20, canvas.width, 20);
            ctx.fillStyle = '#555';
            ctx.fillRect(0, getYPixel(currentParams.yw0), 100, currentParams.yw0 * scale);

            let wizardY = currentParams.yw0 + currentParams.vw0 * t - 0.5 * g * t * t;
            if(wizardY < 0) wizardY = 0; 

            let wizardX = 100 + (t * 15);
            if (wizardX > 140) wizardX = 140;

            drawWizard(wizardX, wizardY);
            
            if(t >= currentParams.t2) {
                drawSword(wizardX + 5, wizardY);
            } else {
                let swordY = currentParams.ys0 + currentParams.vs * t;
                drawSword(140, swordY);
            }

            if(t < targetTime) {
                animationId = requestAnimationFrame(step);
            }
        }
        animationId = requestAnimationFrame(step);
    }

    class Particle {
        constructor(w, h) {
            this.x = w / 2;
            this.y = h / 2 + 50;
            this.vx = (Math.random() - 0.5) * 45;
            this.vy = (Math.random() - 1) * 40 - 5;
            this.size = Math.random() * 10 + 5;
            this.color = `hsl(${Math.random() * 360}, 100%, 50%)`;
            this.gravity = 0.6;
            this.drag = 0.96;
            this.rotation = Math.random() * 360;
            this.rotSpeed = (Math.random() - 0.5) * 25;
        }
        update() {
            this.vy += this.gravity;
            this.vx *= this.drag;
            this.vy *= this.drag;
            this.x += this.vx;
            this.y += this.vy;
            this.rotation += this.rotSpeed;
        }
        draw(ctx) {
            ctx.save();
            ctx.translate(this.x, this.y);
            ctx.rotate(this.rotation * Math.PI / 180);
            ctx.fillStyle = this.color;
            ctx.fillRect(-this.size/2, -this.size/2, this.size, this.size);
            ctx.restore();
        }
    }

    function triggerWin() {
        const winScreen = document.getElementById('winScreen');
        winScreen.style.display = 'flex';
        
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
        
        particles = [];
        for(let i = 0; i < 200; i++) {
            particles.push(new Particle(confettiCanvas.width, confettiCanvas.height));
        }

        if(confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
        
        function animateConfetti() {
            confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
            particles.forEach(p => { p.update(); p.draw(confettiCtx); });
            confettiAnimationId = requestAnimationFrame(animateConfetti);
        }
        animateConfetti();
        
        playAnimation(true); 
    }

    window.onload = generateProblem;
    window.onresize = function() {
        if (document.getElementById('winScreen').style.display === 'flex') {
            confettiCanvas.width = window.innerWidth;
            confettiCanvas.height = window.innerHeight;
        }
    };
</script>
</body>
</html>
