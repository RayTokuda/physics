<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Quiz</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .game-title {
            font-family: 'Space Grotesk', sans-serif;
        }
        #canvas-container {
            width: 100%;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 0.5rem;
            background-color: #1a202c;
            cursor: grab; /* Default cursor for canvas */
        }
        #game-container {
            max-width: 600px;
        }
        .option-btn {
            transition: background-color 0.3s, border-color 0.3s;
            padding: 0.25rem;
        }
        .option-btn canvas {
            border-radius: 0.375rem;
            pointer-events: none;
        }
        .correct {
            background-color: #22c55e !important;
            border-color: #4ade80 !important;
        }
        .incorrect {
            background-color: #ef4444 !important;
            border-color: #f87171 !important;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4ade80;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4ade80;
        }
        
        .confetti {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .confetti-piece {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: hsl(var(--hue), 100%, 50%);
            animation: confetti-fall 2s linear forwards;
        }

        @keyframes confetti-fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <div id="game-container" class="w-full mx-auto p-6 bg-gray-800 rounded-xl shadow-2xl space-y-4">
        <div class="flex justify-between items-center">
            <h1 class="game-title text-3xl font-bold text-cyan-400">Vector Quiz</h1>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p id="score" class="text-xl font-semibold">Score: 0</p>
                    <p id="question-counter" class="text-gray-400">Question: 1 / 5</p>
                </div>
            </div>
        </div>

        <div id="canvas-container">
            <canvas id="vector-canvas"></canvas>
        </div>

        <div id="question-area" class="text-center">
            <p id="question-text" class="text-2xl font-medium">Which vector represents the result?</p>
        </div>

        <div id="options-area" class="grid grid-cols-2 gap-4">
        </div>

        <button id="next-btn" class="hidden w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg text-lg transition duration-300">Next Question</button>

        <p id="feedback-text" class="text-center text-lg h-8"></p>

        <div id="game-over-screen" class="hidden text-center space-y-4 py-8">
            <h2 class="text-4xl font-bold">Quiz Complete!</h2>
            <p id="final-score-text" class="text-2xl">Your score: 5 / 5</p>
            <p id="final-feedback" class="text-lg text-gray-300"></p>
            <div class="flex justify-center space-x-4">
                <button id="play-again-btn" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-6 rounded-lg text-lg transition duration-300">Play Again</button>
            </div>
        </div>
    </div>
    <div id="confetti-container" class="confetti"></div>

    <script>
    window.addEventListener('load', () => {
        const gameContainer = document.getElementById('game-container');
        const canvas = document.getElementById('vector-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const questionCounterEl = document.getElementById('question-counter');
        const questionTextEl = document.getElementById('question-text');
        const questionArea = document.getElementById('question-area');
        const optionsArea = document.getElementById('options-area');
        const nextBtn = document.getElementById('next-btn');
        const feedbackTextEl = document.getElementById('feedback-text');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalScoreTextEl = document.getElementById('final-score-text');
        const finalFeedbackEl = document.getElementById('final-feedback');
        const playAgainBtn = document.getElementById('play-again-btn');
        const canvasContainer = document.getElementById('canvas-container');
        const confettiContainer = document.getElementById('confetti-container');
        
        let score = 0;
        let questionNumber = 1;
        const totalQuestions = 5;
        let bonusQuestion = false;
        let v1, v2, operation, correctAnswer;
        let answerRevealed = false;
        let v1Origin, v2Origin;

        // Dragging state
        let isDragging = false;
        let draggedVectorName = null;
        let dragOffset = { x: 0, y: 0 };
        const vectorScale = 8;

        const encouragingFeedback = [ "Excellent!", "You're a vector virtuoso!", "Perfect!", "Precisely!", "That's it!", "Awesome job!" ];
        const tryAgainFeedback = [ "Great effort! Ready for another challenge?", "You're getting the hang of it! Let's go again!", "Practice makes perfect. One more game?" ];
        const superlativeCongratulations = [
            "Vector Voyageur!", "Calculus Conqueror!", "Geometric Genius!", "Scalar Slayer!",
            "Euclidean Enthusiast!", "Magnitude Mastermind!", "Directional Dynamo!", "Tensor Titan!",
            "Orthogonal Oracle!", "Dimensional Dominator!", "Hyperplane Hero!", "Lineal Luminary!",
            "Parallel Prodigy!", "Perpendicular Pundit!", "Matrix Marvel!", "Affine Authority!",
            "Dot Product Demigod!", "Cross Product Czar!", "Basis Bonanza!", "Span Spelunker!",
            "Norm Nurturer!", "Vector Validator!", "Vector Vindicator!", "Vector Voyager!",
            "Differential Doyen!", "Integral Innovator!", "Kinematic King!", "Static Sensei!",
            "Quantum Quizzard!", "Relativity Rocker!", "Galactic Geometer!", "Astro-Analyst!",
            "Cosmic Calculator!", "Vector Virtuoso!", "Equation Epicure!", "Analytic Ace!",
            "Projection Perfectionist!", "Gradient Guru!", "Divergence Deity!", "Curl Connoisseur!",
            "Quaternion King!", "Transformational Triumphant!"
        ];
        
        const MAX_RESULTANT_MAG_SQ = 100;

        function generateConfetti() {
            for (let i = 0; i < 50; i++) {
                const piece = document.createElement('div');
                piece.classList.add('confetti-piece');
                piece.style.top = `${Math.random() * 100}vh`;
                piece.style.left = `${Math.random() * 100}vw`;
                piece.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                piece.style.animationDelay = `${Math.random() * 0.5}s`;
                confettiContainer.appendChild(piece);
            }
            setTimeout(() => {
                confettiContainer.innerHTML = '';
            }, 3000);
        }

        function generateVisibleVector() {
            const randComp = () => Math.floor(Math.random() * 19) - 9 || 1;
            let x, y;
            do {
                x = randComp();
                y = randComp();
            } while (Math.abs(x) < 3 && Math.abs(y) < 3);
            return { x, y };
        }

        function setupCanvas(width, height) {
            ctx.resetTransform();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            ctx.translate(width / 2, height / 2);
            ctx.scale(1, -1);
        }

        function drawVector(vec, origin, color, label) {
            ctx.beginPath();
            ctx.moveTo(origin.x, origin.y);
            ctx.lineTo(origin.x + vec.x * vectorScale, origin.y + vec.y * vectorScale);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
            const headlen = 10;
            const angle = Math.atan2(vec.y, vec.x);
            ctx.beginPath();
            ctx.moveTo(origin.x + vec.x * vectorScale, origin.y + vec.y * vectorScale);
            ctx.lineTo(origin.x + vec.x * vectorScale - headlen * Math.cos(angle - Math.PI / 6), origin.y + vec.y * vectorScale - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(origin.x + vec.x * vectorScale, origin.y + vec.y * vectorScale);
            ctx.lineTo(origin.x + vec.x * vectorScale - headlen * Math.cos(angle + Math.PI / 6), origin.y + vec.y * vectorScale - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.save();
            ctx.scale(1, -1);
            ctx.fillStyle = color;
            ctx.font = 'bold 16px Inter';
            ctx.fillText(label, origin.x - 20, -(origin.y - 10));
            ctx.restore();
        }

        function drawMiniVector(canvasEl, vec) {
            const ctx = canvasEl.getContext('2d');
            const rect = canvasEl.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasEl.width = rect.width * dpr;
            canvasEl.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(0, 0, rect.width, rect.height);

            ctx.translate(rect.width / 2, rect.height / 2);
            ctx.scale(1, -1);

            ctx.beginPath();
            ctx.strokeStyle = '#2d3748';
            ctx.lineWidth = 0.5;
            ctx.moveTo(-rect.width / 2, 0); ctx.lineTo(rect.width / 2, 0);
            ctx.moveTo(0, -rect.height / 2); ctx.lineTo(0, rect.height / 2);
            ctx.stroke();

            const scale = 8;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(vec.x * scale, vec.y * scale);
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.stroke();

            const headlen = 8;
            const angle = Math.atan2(vec.y, vec.x);
            ctx.beginPath();
            ctx.moveTo(vec.x * scale, vec.y * scale);
            ctx.lineTo(vec.x * scale - headlen * Math.cos(angle - Math.PI / 6), vec.y * scale - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(vec.x * scale, vec.y * scale);
            ctx.lineTo(vec.x * scale - headlen * Math.cos(angle + Math.PI / 6), vec.y * scale - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        function drawGrid() {
            const scale = 4;
            const width = canvasContainer.clientWidth;
            const height = canvasContainer.clientHeight;
            ctx.beginPath();
            ctx.strokeStyle = '#2d3748';
            ctx.lineWidth = 0.5;
            for (let x = scale; x < width / 2; x += scale) {
                ctx.moveTo(x, -height / 2); ctx.lineTo(x, height / 2);
                ctx.moveTo(-x, -height / 2); ctx.lineTo(-x, height / 2);
            }
            for (let y = scale; y < height / 2; y += scale) {
                ctx.moveTo(-width / 2, y); ctx.lineTo(width / 2, y);
                ctx.moveTo(-width / 2, -y); ctx.lineTo(-width / 2, -y);
            }
            ctx.stroke();
            ctx.beginPath();
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1;
            ctx.moveTo(-width / 2, 0); ctx.lineTo(width / 2, 0);
            ctx.moveTo(0, -height / 2); ctx.lineTo(0, height / 2);
            ctx.stroke();
        }

        function draw2DScene() {
            if (!v1 || !v2) return;
            const cssWidth = canvasContainer.clientWidth;
            const cssHeight = canvasContainer.clientHeight;
            if (cssWidth === 0 || cssHeight === 0) return;
            ctx.clearRect(-cssWidth / 2, -cssHeight / 2, cssWidth, cssHeight);
            drawGrid();
            drawVector(v1, v1Origin, '#67e8f9', 'A');
            drawVector(v2, v2Origin, '#f0abfc', 'B');
        }

        function generateQuestion() {
            answerRevealed = false;
            feedbackTextEl.textContent = '';
            nextBtn.classList.add('hidden');
            
            let magSq;
            do {
                v1 = generateVisibleVector();
                v2 = generateVisibleVector();
                operation = Math.random() < 0.5 ? '+' : '-';
                correctAnswer = (operation === '+') ? { x: v1.x + v2.x, y: v1.y + v2.y } : { x: v1.x - v2.x, y: v1.y - v2.y };
                magSq = correctAnswer.x * correctAnswer.x + correctAnswer.y * correctAnswer.y;
            } while (magSq > MAX_RESULTANT_MAG_SQ || (correctAnswer.x === 0 && correctAnswer.y === 0));

            questionTextEl.innerHTML = `Which vector represents <span class="font-bold text-cyan-300">A</span> ${operation} <span class="font-bold text-fuchsia-300">B</span>?`;
            
            const distractors = [];
            distractors.push(operation === '+' ? { x: v1.x - v2.x, y: v1.y - v2.y } : { x: v1.x + v2.x, y: v1.y + v2.y });
            if (operation === '-') {
                distractors.push({ x: v2.x - v1.x, y: v2.y - v1.y });
            } else {
                distractors.push({ x: -correctAnswer.x, y: -correctAnswer.y });
            }
            distractors.push({ x: correctAnswer.y, y: correctAnswer.x });
            distractors.push({ x: -correctAnswer.x, y: correctAnswer.y });
            distractors.push({ x: correctAnswer.x, y: -correctAnswer.y });
            distractors.push(v1);
            distractors.push(v2);
            distractors.sort(() => Math.random() - 0.5);

            let options = [correctAnswer];
            const usedOptions = new Set([`⟨${correctAnswer.x}, ${correctAnswer.y}⟩`]);

            for (const distractor of distractors) {
                if (options.length >= 4) break;
                const optionString = `⟨${distractor.x}, ${distractor.y}⟩`;
                if (!usedOptions.has(optionString)) {
                    options.push(distractor);
                    usedOptions.add(optionString);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            
            optionsArea.innerHTML = '';
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn', 'bg-gray-700', 'border-2', 'border-gray-600', 'hover:border-cyan-400', 'rounded-lg');
                const miniCanvas = document.createElement('canvas');
                miniCanvas.classList.add('w-full', 'h-60');
                btn.appendChild(miniCanvas);
                btn.dataset.answer = JSON.stringify(opt);
                btn.addEventListener('click', checkAnswer);
                optionsArea.appendChild(btn);
                requestAnimationFrame(() => drawMiniVector(miniCanvas, opt));
            });
            draw2DScene();
        }

        function checkAnswer(event) {
            if (answerRevealed) return;
            answerRevealed = true;
            
            const selectedBtn = event.currentTarget;
            const selectedAnswer = JSON.parse(selectedBtn.dataset.answer);

            const isCorrect = selectedAnswer.x === correctAnswer.x && selectedAnswer.y === correctAnswer.y;

            if (isCorrect) {
                score++;
                scoreEl.textContent = `Score: ${score}`;
                feedbackTextEl.textContent = encouragingFeedback[Math.floor(Math.random() * encouragingFeedback.length)];
                feedbackTextEl.classList.add('text-green-400');
                selectedBtn.classList.add('correct');
            } else {
                feedbackTextEl.textContent = 'Not quite!';
                feedbackTextEl.classList.add('text-red-400');
                selectedBtn.classList.add('incorrect');
                document.querySelectorAll('.option-btn').forEach(btn => {
                    const btnAnswer = JSON.parse(btn.dataset.answer);
                    if (btnAnswer.x === correctAnswer.x && btnAnswer.y === correctAnswer.y) {
                        btn.classList.add('correct');
                    }
                });
            }

            let nextBtnText = 'Next Question';
            if (questionNumber === totalQuestions && score === totalQuestions && !bonusQuestion) {
                nextBtnText = 'Start Bonus Round';
            } else if (questionNumber === totalQuestions + 1) {
                 nextBtnText = 'Finish Quiz';
            }
            nextBtn.textContent = nextBtnText;
            nextBtn.classList.remove('hidden');
        }
        
        function nextQuestion() {
            if (questionNumber === totalQuestions && score === totalQuestions && !bonusQuestion) {
                bonusQuestion = true;
                questionNumber++;
                questionCounterEl.textContent = `Question: ${questionNumber} / ${totalQuestions + 1}`;
                generateQuestion();
                nextBtn.textContent = 'Finish Quiz';
            } else {
                questionNumber++;
                if (questionNumber > totalQuestions && !bonusQuestion) {
                    endGame();
                } else if (questionNumber > totalQuestions + 1 && bonusQuestion) {
                    endGame();
                } else {
                    questionCounterEl.textContent = `Question: ${questionNumber} / ${totalQuestions}`;
                    generateQuestion();
                }
            }
        }

        function endGame() {
            optionsArea.classList.add('hidden');
            questionArea.classList.add('hidden');
            nextBtn.classList.add('hidden');
            feedbackTextEl.classList.add('hidden');

            let finalScoreDisplay = `${score} / ${totalQuestions}`;
            let finalFeedbackText = tryAgainFeedback[Math.floor(Math.random() * tryAgainFeedback.length)];
            
            if (bonusQuestion && score === totalQuestions + 1) {
                 finalScoreDisplay = `${score} / ${totalQuestions}`;
                 finalFeedbackText = superlativeCongratulations[Math.floor(Math.random() * superlativeCongratulations.length)];
                 generateConfetti();
            } else if (score === totalQuestions) {
                finalFeedbackText = 'Perfect score! You\'re a pro!';
            }

            finalScoreTextEl.textContent = `Your final score: ${finalScoreDisplay}`;
            finalFeedbackEl.textContent = finalFeedbackText;
            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            questionNumber = 1;
            answerRevealed = false;
            bonusQuestion = false;

            scoreEl.textContent = `Score: 0`;
            questionCounterEl.textContent = `Question: 1 / ${totalQuestions}`;
            
            gameOverScreen.classList.add('hidden');
            optionsArea.classList.remove('hidden');
            questionArea.classList.remove('hidden');
            feedbackTextEl.classList.remove('hidden');
            nextBtn.textContent = 'Next Question';
            
            // Re-randomize initial positions for a fresh start
            v1Origin = { x: (Math.random() - 0.7) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };
            v2Origin = { x: (Math.random() - 0.3) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };

            handleResize();
            generateQuestion();
        }
        
        function handleResize() {
            const width = gameContainer.clientWidth;
            if (width === 0) return;
            const height = width * 0.75;
            canvasContainer.style.height = `${height}px`;
            
            requestAnimationFrame(() => {
                setupCanvas(width, height);
                draw2DScene();
            });
        }
        
        function getCanvasMousePosition(event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            const translatedX = mouseX - canvas.width / (2 * (window.devicePixelRatio || 1));
            const translatedY = -(mouseY - canvas.height / (2 * (window.devicePixelRatio || 1)));
            return { x: translatedX, y: translatedY };
        }

        // Helper function to calculate distance from a point to a line segment
        function distToSegmentSquared(p, a, b) {
            const l2 = (b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y);
            if (l2 === 0) return (p.x - a.x) * (p.x - a.x) + (p.y - a.y) * (p.y - a.y);
            let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            const closestPoint = { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
            return (p.x - closestPoint.x) * (p.x - closestPoint.x) + (p.y - closestPoint.y) * (p.y - closestPoint.y);
        }

        function getVectorAtPoint(point) {
            const tolerance = 25; // Squared distance tolerance for easier clicking
            const v1End = { x: v1Origin.x + v1.x * vectorScale, y: v1Origin.y + v1.y * vectorScale };
            const v2End = { x: v2Origin.x + v2.x * vectorScale, y: v2Origin.y + v2.y * vectorScale };
            
            if (distToSegmentSquared(point, v1Origin, v1End) <= tolerance) return 'A';
            if (distToSegmentSquared(point, v2Origin, v2End) <= tolerance) return 'B';
            
            return null;
        }

        function onDragStart(event) {
            const point = getCanvasMousePosition(event);
            const vectorName = getVectorAtPoint(point);
            if (vectorName) {
                isDragging = true;
                draggedVectorName = vectorName;
                const origin = vectorName === 'A' ? v1Origin : v2Origin;
                dragOffset.x = point.x - origin.x;
                dragOffset.y = point.y - origin.y;
                canvas.style.cursor = 'grabbing';
            }
        }
        
        function onDrag(event) {
            const point = getCanvasMousePosition(event);
            const vectorName = getVectorAtPoint(point);
            if (!isDragging) {
                if (vectorName) {
                    canvas.style.cursor = 'pointer';
                } else {
                    canvas.style.cursor = 'grab';
                }
            }
            if (!isDragging) return;
            event.preventDefault(); // Prevent text selection
            const newOrigin = { x: point.x - dragOffset.x, y: point.y - dragOffset.y };

            if (draggedVectorName === 'A') {
                v1Origin = newOrigin;
            } else if (draggedVectorName === 'B') {
                v2Origin = newOrigin;
            }
            
            draw2DScene();
        }

        function onDragEnd() {
            isDragging = false;
            draggedVectorName = null;
            canvas.style.cursor = 'grab';
        }

        function init() {
            if (gameContainer.clientWidth === 0) {
                requestAnimationFrame(init);
                return;
            }

            // Set initial random positions
            v1Origin = { x: (Math.random() - 0.7) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };
            v2Origin = { x: (Math.random() - 0.3) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };

            handleResize();
            requestAnimationFrame(() => {
                generateQuestion();
            });

            window.addEventListener('resize', handleResize);
            nextBtn.addEventListener('click', nextQuestion);
            playAgainBtn.addEventListener('click', resetGame);
            
            // Mouse events for dragging
            canvas.addEventListener('mousedown', onDragStart);
            canvas.addEventListener('mousemove', onDrag);
            canvas.addEventListener('mouseup', onDragEnd);
            canvas.addEventListener('mouseleave', onDragEnd);

            // Touch events for mobile dragging
            canvas.addEventListener('touchstart', (e) => onDragStart(e.touches[0]), { passive: false });
            canvas.addEventListener('touchmove', (e) => onDrag(e.touches[0]), { passive: false });
            canvas.addEventListener('touchend', onDragEnd);
        }

        init();
    });
    </script>
</body>
</html>
