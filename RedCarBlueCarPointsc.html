<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Physics Race Game</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #1a202c;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 1rem;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 900px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        
        .car-section {
            display: flex;
            flex-direction: column;
            width: 100%;
            background-color: #2d3748;
            padding: 1rem;
            border-bottom: 2px solid #4a5568;
        }

        .car-section:last-child {
            border-bottom: none;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .button-primary, .button-secondary {
            padding: 0.5rem 1rem;
            border-radius: 9999px;
            font-weight: 600;
            transition: background-color 0.2s, transform 0.1s;
            cursor: pointer;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            white-space: nowrap;
        }

        .button-primary:active, .button-secondary:active {
            transform: scale(0.97);
        }

        .button-primary {
            background-color: #48bb78;
            color: #1a202c;
        }

        .button-primary:hover {
            background-color: #38a169;
        }

        .button-secondary {
            background-color: #a0aec0;
            color: #1a202c;
        }

        .button-secondary:hover {
            background-color: #718096;
        }

        .canvas-container {
            position: relative;
            width: 100%;
            height: 200px;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .modal {
            background-color: #2d3748;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 480px;
            width: 90%;
        }

        .info-card {
            background-color: #1f2937;
            border-radius: 8px;
            padding: 0.75rem 1rem;
            box-shadow: 0 2px 4px -1px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 flex flex-col items-center justify-center p-4 min-h-screen">

    <div id="game-intro" class="text-center p-8 rounded-xl bg-gray-800 shadow-xl max-w-lg mb-8 border border-gray-700">
        <h1 class="text-3xl font-extrabold mb-3 text-blue-400">Physics Race Challenge</h1>
        <p class="text-gray-300 mb-6 text-sm leading-relaxed">
            Observe the animation, measure kinematics values, and calculate the exact time and distance where the cars meet.
        </p>
        <div class="mb-6 text-left">
            <label for="student-name" class="block text-sm font-semibold mb-2 text-gray-200">Enter Your Full Name:</label>
            <input type="text" id="student-name" class="w-full p-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-blue-500 transition-colors" placeholder="e.g. Alex Smith" required>
            <p id="name-error" class="text-red-400 text-xs mt-2 hidden font-medium">⚠️ Please enter your name to start the race.</p>
        </div>
        <button id="start-game-button" class="button-primary w-full py-3 text-lg font-bold">Start Race</button>
    </div>

    <div id="game-ui" class="game-container hidden">
        <div class="flex flex-col md:flex-row justify-center items-center gap-3 p-4 bg-gray-800 border-b border-gray-700">
            <div class="info-card w-full md:w-auto">
                <label for="simulationSpeed" class="text-xs font-semibold block mb-1 text-gray-300">Simulation Speed:</label>
                <input type="range" id="simulationSpeed" min="0.1" max="2" step="0.1" value="1" class="w-full md:w-32 cursor-pointer">
            </div>
            <div class="info-card text-center flex-1">
                <span class="text-xs uppercase font-bold text-gray-400 block mb-1">Scenario</span>
                <div id="scenario-badge" class="font-bold text-sm text-yellow-300"></div>
            </div>
            <div class="info-card text-center min-w-[120px]">
                <span class="text-xs uppercase font-bold text-gray-400 block mb-1">Initial Position</span>
                <span id="initial-xo-display" class="font-mono font-bold text-lg text-emerald-400">xo = 0 m</span>
            </div>
        </div>

        <!-- Red Car Track -->
        <div id="red-car-section" class="car-section">
            <div class="flex items-center justify-between mb-2 text-sm">
                <h2 class="car-section-title text-lg font-bold text-red-400">Red Car <span id="red-dir-tag" class="text-xs text-gray-400 font-normal ml-1"></span></h2>
                <span>Time: <span id="red-time" class="font-mono font-bold text-red-300">0.00</span> s</span>
            </div>
            <div class="canvas-container rounded-lg bg-gray-700 overflow-hidden">
                <canvas id="redCanvas"></canvas>
            </div>
            <div class="controls">
                <button id="red-start-pause" class="button-primary">Start</button>
                <button id="red-prev-frame" class="button-secondary">Prev Frame</button>
                <button id="red-next-frame" class="button-secondary">Next Frame</button>
                <button id="red-reset" class="button-secondary">Reset</button>
            </div>
        </div>

        <!-- Blue Car Track -->
        <div id="blue-car-section" class="car-section">
            <div class="flex items-center justify-between mb-2 text-sm">
                <h2 class="car-section-title text-lg font-bold text-blue-400">Blue Car <span id="blue-dir-tag" class="text-xs text-gray-400 font-normal ml-1"></span></h2>
                <span>Time: <span id="blue-time" class="font-mono font-bold text-blue-300">0.00</span> s</span>
            </div>
            <div class="canvas-container rounded-lg bg-gray-700 overflow-hidden">
                <canvas id="blueCanvas"></canvas>
            </div>
            <div class="controls">
                <button id="blue-start-pause" class="button-primary">Start</button>
                <button id="blue-prev-frame" class="button-secondary">Prev Frame</button>
                <button id="blue-next-frame" class="button-secondary">Next Frame</button>
                <button id="blue-reset" class="button-secondary">Reset</button>
            </div>
        </div>

        <!-- Prediction Form -->
        <div id="prediction-section" class="car-section bg-gray-800 p-5 rounded-b-xl w-full">
            <h3 class="text-lg font-bold text-center mb-3 text-gray-100">Submit Your Prediction</h3>
            <div class="flex flex-col md:flex-row justify-center items-center gap-4">
                <div class="flex flex-col w-full md:w-auto">
                    <label for="predict-time" class="mb-1 text-xs font-semibold text-gray-300">Catch-up Time (s):</label>
                    <input type="number" step="0.01" id="predict-time" class="w-full md:w-44 p-2.5 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:outline-none focus:border-blue-400" placeholder="e.g. 8.45">
                </div>
                <div class="flex flex-col w-full md:w-auto">
                    <label for="predict-distance" class="mb-1 text-xs font-semibold text-gray-300">Catch-up Distance (m):</label>
                    <input type="number" step="0.01" id="predict-distance" class="w-full md:w-44 p-2.5 rounded-lg bg-gray-700 border border-gray-600 text-gray-100 focus:outline-none focus:border-blue-400" placeholder="e.g. 120.50">
                </div>
            </div>
            <div class="flex justify-center mt-4">
                <button id="submit-prediction" class="button-primary px-8 py-2.5 font-bold">Submit & Watch Full Race</button>
            </div>
        </div>
    </div>
    
    <!-- Win/Loss Results Modal -->
    <div id="resultModal" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitle" class="text-2xl font-bold mb-2"></h3>
            <div id="modalMessage" class="text-gray-300 my-4"></div>
            <button id="restartGame" class="button-primary w-full py-2.5 mt-2">Play Again</button>
        </div>
    </div>

    <script>
        const gameState = {
            studentName: '',
            carSize: 4, // in meters
            scenarioMode: 'BLUE_LEFT', // 'BLUE_LEFT' or 'RED_LEFT'
            xo: 0, // Initial position in meters
            red: {
                time: 0,
                position: 0,
                acceleration: 0,
                direction: 'RIGHT',
                isPlaying: false,
                requestAnimFrameId: null,
                lastFrameTime: null,
                cameraOffset: 0,
            },
            blue: {
                time: 0,
                position: 0,
                velocity: 0,
                direction: 'RIGHT',
                isPlaying: false,
                requestAnimFrameId: null,
                lastFrameTime: null,
                cameraOffset: 0,
            },
            simulationSpeed: 1,
            visibleTrackLength: 60, // Visible meters across screen
            pixelsPerMeter: 10,
            catchup: {
                time: 0,
                distance: 0,
                stopTime: 0,
            },
            animMode: 'observation',
            fixedCarScreenPos: 0.2,
        };

        // DOM elements
        const redCanvas = document.getElementById('redCanvas');
        const blueCanvas = document.getElementById('blueCanvas');
        const redCtx = redCanvas.getContext('2d');
        const blueCtx = blueCanvas.getContext('2d');
        const redTimeEl = document.getElementById('red-time');
        const blueTimeEl = document.getElementById('blue-time');
        const scenarioBadgeEl = document.getElementById('scenario-badge');
        const initialXoDisplayEl = document.getElementById('initial-xo-display');
        const redDirTagEl = document.getElementById('red-dir-tag');
        const blueDirTagEl = document.getElementById('blue-dir-tag');
        const startGameButton = document.getElementById('start-game-button');
        const gameIntro = document.getElementById('game-intro');
        const gameUI = document.getElementById('game-ui');
        const submitPredictionButton = document.getElementById('submit-prediction');
        const predictTimeInput = document.getElementById('predict-time');
        const predictDistanceInput = document.getElementById('predict-distance');
        const resultModal = document.getElementById('resultModal');
        const modalTitle = document.getElementById('modalTitle');
        const modalMessage = document.getElementById('modalMessage');
        const restartGameButton = document.getElementById('restartGame');
        const simulationSpeedInput = document.getElementById('simulationSpeed');

        const redButtons = {
            startPause: document.getElementById('red-start-pause'),
            prevFrame: document.getElementById('red-prev-frame'),
            nextFrame: document.getElementById('red-next-frame'),
            reset: document.getElementById('red-reset'),
        };

        const blueButtons = {
            startPause: document.getElementById('blue-start-pause'),
            prevFrame: document.getElementById('blue-prev-frame'),
            nextFrame: document.getElementById('blue-next-frame'),
            reset: document.getElementById('blue-reset'),
        };

        function resizeCanvas() {
            [redCanvas, blueCanvas].forEach(canvas => {
                if (canvas && canvas.parentElement) {
                    canvas.width = canvas.parentElement.clientWidth;
                    canvas.height = canvas.parentElement.clientHeight || 200;
                }
            });
            gameState.pixelsPerMeter = redCanvas.width / gameState.visibleTrackLength;
        }

        function initializeGame() {
            gameState.scenarioMode = Math.random() < 0.5 ? 'BLUE_LEFT' : 'RED_LEFT';
            gameState.xo = Math.round(Math.random() * (110 - 45) + 45);

            const accel = parseFloat((Math.random() * (7.5 - 1.2) + 1.2).toFixed(2));
            const vel = parseFloat((Math.random() * (26 - 12) + 12).toFixed(2));

            gameState.red.acceleration = accel;
            gameState.blue.velocity = vel;

            if (gameState.scenarioMode === 'BLUE_LEFT') {
                gameState.blue.direction = 'LEFT';
                gameState.blue.position = gameState.xo;
                gameState.red.direction = 'RIGHT';
                gameState.red.position = 0;

                scenarioBadgeEl.textContent = "Blue car starts at xo & moves LEFT";
                redDirTagEl.textContent = "(Accelerating Right from x = 0)";
                blueDirTagEl.textContent = `(Moving Left from xo = ${gameState.xo} m)`;
            } else {
                gameState.red.direction = 'LEFT';
                gameState.red.position = gameState.xo;
                gameState.blue.direction = 'RIGHT';
                gameState.blue.position = 0;

                scenarioBadgeEl.textContent = "Red car starts at xo & accelerates LEFT";
                redDirTagEl.textContent = `(Accelerating Left from xo = ${gameState.xo} m)`;
                blueDirTagEl.textContent = "(Moving Right from x = 0)";
            }

            initialXoDisplayEl.textContent = `xo = ${gameState.xo} m`;

            gameState.red.time = 0;
            gameState.blue.time = 0;

            stopAnimation('red');
            stopAnimation('blue');

            const a = gameState.red.acceleration;
            const v = gameState.blue.velocity;
            const xo = gameState.xo;

            const t_catchup = (-v + Math.sqrt(v * v + 2 * a * xo)) / a;
            gameState.catchup.time = t_catchup;

            if (gameState.scenarioMode === 'BLUE_LEFT') {
                gameState.catchup.distance = 0.5 * a * t_catchup * t_catchup;
            } else {
                gameState.catchup.distance = v * t_catchup;
            }

            const stopPercentage = Math.random() * (0.8 - 0.55) + 0.55;
            gameState.catchup.stopTime = t_catchup * stopPercentage;

            predictTimeInput.value = '';
            predictDistanceInput.value = '';

            updateCamera('red');
            updateCamera('blue');
            draw();
        }

        function calculatePositions(car) {
            const t = gameState[car].time;
            const a = gameState.red.acceleration;
            const v = gameState.blue.velocity;
            const xo = gameState.xo;

            if (gameState.scenarioMode === 'BLUE_LEFT') {
                if (car === 'red') {
                    gameState.red.position = 0.5 * a * Math.pow(t, 2);
                } else {
                    gameState.blue.position = Math.max(0, xo - v * t);
                }
            } else {
                if (car === 'red') {
                    gameState.red.position = Math.max(0, xo - 0.5 * a * Math.pow(t, 2));
                } else {
                    gameState.blue.position = v * t;
                }
            }
        }

        function animate(car) {
            const now = performance.now();
            const carState = gameState[car];

            if (carState.isPlaying) {
                const deltaTime = (now - (carState.lastFrameTime || now)) / 1000 * gameState.simulationSpeed;
                carState.time += deltaTime;
                carState.lastFrameTime = now;

                calculatePositions(car);

                if (gameState.animMode === 'observation') {
                    if (carState.time >= gameState.catchup.stopTime) {
                        carState.time = gameState.catchup.stopTime;
                        calculatePositions(car);
                        pauseAnimation('red');
                        pauseAnimation('blue');
                        updateCamera(car);
                        draw();
                        return;
                    }
                } else if (gameState.animMode === 'catchup') {
                    if (carState.time >= gameState.catchup.time) {
                        carState.time = gameState.catchup.time;
                        calculatePositions(car);
                        stopAnimation('red');
                        stopAnimation('blue');
                        updateCamera(car);
                        draw();
                        setTimeout(checkPrediction, 400);
                        return;
                    }
                }

                updateCamera(car);
                draw();
                carState.requestAnimFrameId = requestAnimationFrame(() => animate(car));
            }
        }

        function updateCamera(car) {
            const carState = gameState[car];
            const canvasEl = car === 'red' ? redCanvas : blueCanvas;
            if (!canvasEl) return;
            
            const fixedScreenPositionMeters = canvasEl.width * gameState.fixedCarScreenPos / gameState.pixelsPerMeter;
            const targetOffset = carState.position - fixedScreenPositionMeters;
            carState.cameraOffset = Math.max(0, targetOffset);
        }

        function togglePlay(car) {
            const carState = gameState[car];
            carState.isPlaying = !carState.isPlaying;
            const btn = car === 'red' ? redButtons.startPause : blueButtons.startPause;
            
            if (carState.isPlaying) {
                btn.textContent = 'Pause';
                carState.lastFrameTime = performance.now();
                animate(car);
            } else {
                btn.textContent = 'Start';
                if (carState.requestAnimFrameId) {
                    cancelAnimationFrame(carState.requestAnimFrameId);
                }
            }
        }

        function stopAnimation(car) {
            const carState = gameState[car];
            carState.isPlaying = false;
            const btn = car === 'red' ? redButtons.startPause : blueButtons.startPause;
            if (btn) btn.textContent = 'Start';
            if (carState.requestAnimFrameId) {
                cancelAnimationFrame(carState.requestAnimFrameId);
                carState.requestAnimFrameId = null;
            }
        }

        function pauseAnimation(car) {
            stopAnimation(car);
        }

        function advanceFrame(car) {
            if (gameState.red.isPlaying || gameState.blue.isPlaying) return;
            const carState = gameState[car];
            carState.time += 0.05;
            calculatePositions(car);
            updateCamera(car);
            draw();
        }

        function prevFrame(car) {
            if (gameState.red.isPlaying || gameState.blue.isPlaying) return;
            const carState = gameState[car];
            if (carState.time > 0) {
                carState.time = Math.max(0, carState.time - 0.05);
                calculatePositions(car);
                updateCamera(car);
                draw();
            }
        }

        function resetCar(car) {
            stopAnimation(car);
            gameState[car].time = 0;
            calculatePositions(car);
            updateCamera(car);
            draw();
        }

        function drawTrack(ctx, canvas, cameraOffset) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#374151';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            ctx.fillStyle = '#9ca3af';
            ctx.font = '11px sans-serif';
            ctx.strokeStyle = '#4b5563';
            ctx.lineWidth = 1;

            const startMeters = Math.floor(cameraOffset / 5) * 5;
            const endMeters = startMeters + gameState.visibleTrackLength + 10;

            for (let m = startMeters; m <= endMeters; m += 5) {
                const xPos = (m - cameraOffset) * gameState.pixelsPerMeter;
                if (xPos >= 0 && xPos <= canvas.width) {
                    ctx.beginPath();
                    ctx.moveTo(xPos, canvas.height - 25);
                    ctx.lineTo(xPos, canvas.height);
                    ctx.stroke();

                    if (m % 10 === 0) {
                        ctx.fillText(`${m}m`, xPos + 2, canvas.height - 30);
                    }
                }
            }
        }

        function drawCar(ctx, carState, canvasWidth, canvasHeight) {
            const xPosScreen = (carState.position - carState.cameraOffset) * gameState.pixelsPerMeter;
            const carWidth = gameState.carSize * gameState.pixelsPerMeter;
            const carHeight = gameState.carSize * 0.5 * gameState.pixelsPerMeter;
            const yOffset = (canvasHeight / 2) - (carHeight / 2);
            const isRed = carState === gameState.red;
            const isFacingLeft = carState.direction === 'LEFT';

            ctx.fillStyle = isRed ? '#ef4444' : '#3b82f6';
            ctx.beginPath();

            if (isFacingLeft) {
                ctx.roundRect(xPosScreen, yOffset, carWidth, carHeight, 4);
            } else {
                ctx.roundRect(xPosScreen - carWidth, yOffset, carWidth, carHeight, 4);
            }
            ctx.fill();

            // Cockpit
            ctx.fillStyle = '#1e293b';
            if (isFacingLeft) {
                ctx.fillRect(xPosScreen + carWidth * 0.2, yOffset + carHeight * 0.15, carWidth * 0.5, carHeight * 0.7);
            } else {
                ctx.fillRect(xPosScreen - carWidth * 0.7, yOffset + carHeight * 0.15, carWidth * 0.5, carHeight * 0.7);
            }
            
            // Headlights
            ctx.fillStyle = '#fef08a';
            if (isFacingLeft) {
                ctx.fillRect(xPosScreen, yOffset + carHeight * 0.1, 3, carHeight * 0.25);
                ctx.fillRect(xPosScreen, yOffset + carHeight * 0.65, 3, carHeight * 0.25);
            } else {
                ctx.fillRect(xPosScreen - 3, yOffset + carHeight * 0.1, 3, carHeight * 0.25);
                ctx.fillRect(xPosScreen - 3, yOffset + carHeight * 0.65, 3, carHeight * 0.25);
            }
        }

        function draw() {
            if (!redCanvas || !blueCanvas) return;
            drawTrack(redCtx, redCanvas, gameState.red.cameraOffset);
            drawTrack(blueCtx, blueCanvas, gameState.blue.cameraOffset);

            drawCar(redCtx, gameState.red, redCanvas.width, redCanvas.height);
            drawCar(blueCtx, gameState.blue, blueCanvas.width, blueCanvas.height);

            if (redTimeEl) redTimeEl.textContent = gameState.red.time.toFixed(2);
            if (blueTimeEl) blueTimeEl.textContent = gameState.blue.time.toFixed(2);
        }

        function generateSecurityCode(name, timeError, distError, combinedError, scoreText) {
            const cleanName = name.toUpperCase().replace(/[^A-Z]/g, '');
            const char1 = cleanName[0] || 'A';
            const char2 = cleanName[Math.floor(cleanName.length / 2)] || 'B';
            const char3 = cleanName[cleanName.length - 1] || 'C';
            const numHash = Math.abs(Math.sin(combinedError * 9876 + name.length * 123) * 10000).toFixed(0).padStart(4, '0');
            const timestamp = Date.now().toString(36).toUpperCase().slice(-4);
            return `VERIFY-${char1}${char2}${char3}-${numHash}-${timestamp}`;
        }

        function checkPrediction() {
            const userTime = parseFloat(predictTimeInput.value);
            const userDist = parseFloat(predictDistanceInput.value);
            const actualTime = gameState.catchup.time;
            const actualDist = gameState.catchup.distance;

            const timeErrPct = Math.abs(userTime - actualTime) / actualTime * 100;
            const distErrPct = Math.abs(userDist - actualDist) / actualDist * 100;
            const combinedErr = (timeErrPct + distErrPct) / 2;

            let title = '';
            let scoreBadge = '';
            let message = '';

            if (combinedErr <= 1.0) {
                title = ' Outstanding Physics Mastery!';
                scoreBadge = '<div class="text-4xl font-extrabold text-yellow-300 my-3 bg-yellow-900/50 p-3 rounded-lg border border-yellow-500 shadow-lg">Score: 6 / 5 (Bonus Point!)</div>';
                message = `Incredible accuracy! Combined Error: <strong>${combinedErr.toFixed(2)}%</strong>.<br><br>` +
                          `Actual Time: <strong>${actualTime.toFixed(2)} s</strong> | Your Time: ${userTime.toFixed(2)} s<br>` +
                          `Actual Distance: <strong>${actualDist.toFixed(2)} m</strong> | Your Distance: ${userDist.toFixed(2)} m`;
                
                if (typeof confetti === 'function') {
                    confetti({ particleCount: 120, spread: 80, origin: { y: 0.6 } });
                    setTimeout(() => confetti({ particleCount: 60, angle: 60, spread: 55, origin: { x: 0 } }), 250);
                    setTimeout(() => confetti({ particleCount: 60, angle: 120, spread: 55, origin: { x: 1 } }), 400);
                }
            } else if (combinedErr <= 7.0) {
                title = ' Excellent Work!';
                scoreBadge = '<div class="text-4xl font-extrabold text-emerald-400 my-3 bg-emerald-900/50 p-3 rounded-lg border border-emerald-500">Score: 5 / 5</div>';
                message = `Great job! Combined Error: <strong>${combinedErr.toFixed(2)}%</strong>.<br><br>` +
                          `Actual Time: <strong>${actualTime.toFixed(2)} s</strong> | Your Time: ${userTime.toFixed(2)} s<br>` +
                          `Actual Distance: <strong>${actualDist.toFixed(2)} m</strong> | Your Distance: ${userDist.toFixed(2)} m`;
            } else if (combinedErr <= 10.0) {
                title = ' Good Effort!';
                scoreBadge = '<div class="text-4xl font-extrabold text-blue-400 my-3 bg-blue-900/50 p-3 rounded-lg border border-blue-500">Score: 4 / 5</div>';
                message = `Solid attempt! Combined Error: <strong>${combinedErr.toFixed(2)}%</strong>.<br><br>` +
                          `Actual Time: <strong>${actualTime.toFixed(2)} s</strong> | Your Time: ${userTime.toFixed(2)} s<br>` +
                          `Actual Distance: <strong>${actualDist.toFixed(2)} m</strong> | Your Distance: ${userDist.toFixed(2)} m`;
            } else {
                title = ' Try Again!';
                scoreBadge = '<div class="text-2xl font-bold text-red-400 my-3 bg-red-900/50 p-3 rounded-lg border border-red-500">Error Exceeded 10%</div>';
                message = `Combined Error: <strong>${combinedErr.toFixed(2)}%</strong> (Time err: ${timeErrPct.toFixed(1)}%, Distance err: ${distErrPct.toFixed(1)}%).<br><br>` +
                          `Actual Time: <strong>${actualTime.toFixed(2)} s</strong><br>` +
                          `Actual Distance: <strong>${actualDist.toFixed(2)} m</strong><br><br>` +
                          `Please try again to get your error under 10%!`;
            }

            const verifyCode = generateSecurityCode(gameState.studentName, timeErrPct, distErrPct, combinedErr, title);

            modalTitle.textContent = title;
            modalMessage.innerHTML = `
                <p class="text-base font-semibold text-gray-200">Student: <span class="text-blue-300 font-bold">${gameState.studentName}</span></p>
                ${scoreBadge}
                <div class="text-sm text-gray-300 my-3">${message}</div>
                <div class="mt-4 pt-3 border-t border-gray-600 text-left text-xs font-mono text-gray-400">
                    <div>Anti-Cheat Security Code:</div>
                    <div class="font-bold text-emerald-400 select-all tracking-wider text-sm mt-1 bg-gray-900 p-2 rounded border border-gray-700">${verifyCode}</div>
                </div>
            `;

            resultModal.style.display = 'flex';
        }

        startGameButton.addEventListener('click', () => {
            const studentNameInput = document.getElementById('student-name');
            const nameError = document.getElementById('name-error');
            const name = studentNameInput.value.trim();

            if (!name) {
                nameError.classList.remove('hidden');
                return;
            }

            nameError.classList.add('hidden');
            gameState.studentName = name;
            
            gameIntro.classList.add('hidden');
            gameUI.classList.remove('hidden');

            resizeCanvas();
            initializeGame();
        });

        submitPredictionButton.addEventListener('click', () => {
            const predictedTime = parseFloat(predictTimeInput.value);
            const predictedDistance = parseFloat(predictDistanceInput.value);

            if (isNaN(predictedTime) || isNaN(predictedDistance)) {
                alert('Please enter valid numerical values for time and distance.');
                return;
            }
            
            gameState.animMode = 'catchup';
            gameState.red.time = 0;
            gameState.blue.time = 0;
            calculatePositions('red');
            calculatePositions('blue');
            updateCamera('red');
            updateCamera('blue');

            gameState.red.isPlaying = true;
            gameState.blue.isPlaying = true;
            redButtons.startPause.textContent = 'Pause';
            blueButtons.startPause.textContent = 'Pause';
            
            gameState.red.lastFrameTime = performance.now();
            gameState.blue.lastFrameTime = performance.now();
            
            animate('red');
            animate('blue');
        });

        restartGameButton.addEventListener('click', () => {
            resultModal.style.display = 'none';
            gameState.animMode = 'observation';
            initializeGame();
        });

        simulationSpeedInput.addEventListener('input', (e) => {
            gameState.simulationSpeed = parseFloat(e.target.value);
        });

        redButtons.startPause.addEventListener('click', () => togglePlay('red'));
        redButtons.prevFrame.addEventListener('click', () => prevFrame('red'));
        redButtons.nextFrame.addEventListener('click', () => advanceFrame('red'));
        redButtons.reset.addEventListener('click', () => resetCar('red'));

        blueButtons.startPause.addEventListener('click', () => togglePlay('blue'));
        blueButtons.prevFrame.addEventListener('click', () => prevFrame('blue'));
        blueButtons.nextFrame.addEventListener('click', () => advanceFrame('blue'));
        blueButtons.reset.addEventListener('click', () => resetCar('blue'));

        window.addEventListener('resize', () => {
            if (!gameUI.classList.contains('hidden')) {
                resizeCanvas();
                draw();
            }
        });
    </script>
</body>
</html>
