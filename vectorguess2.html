<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Quiz 2</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Space+Grotesk:wght500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .game-title {
            font-family: 'Space Grotesk', sans-serif;
        }
        #canvas-container {
            width: 100%;
        }
        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 0.5rem;
            background-color: #1a202c;
            cursor: grab;
        }
        #game-container, #start-screen {
            max-width: 600px;
        }
        .option-btn {
            transition: background-color 0.3s, border-color 0.3s, transform 0.1s;
            padding: 0.25rem;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .option-btn canvas {
            border-radius: 0.375rem;
            pointer-events: none;
        }
        .selected {
            border-color: #fbbf24 !important; /* Yellow-400 */
            box-shadow: 0 0 0 4px rgba(251, 191, 36, 0.3);
        }
        .correct {
            background-color: #22c55e !important;
            border-color: #4ade80 !important;
        }
        .incorrect {
            background-color: #ef4444 !important;
            border-color: #f87171 !important;
        }
        .toggle-checkbox:checked {
            right: 0;
            border-color: #4ade80;
        }
        .toggle-checkbox:checked + .toggle-label {
            background-color: #4ade80;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4">

    <!-- Start Screen -->
    <div id="start-screen" class="w-full mx-auto p-8 bg-gray-800 rounded-xl shadow-2xl space-y-6 text-center">
        <h1 class="game-title text-5xl font-bold text-cyan-400">Vector Quiz 2</h1>
        <p class="text-gray-300 text-lg">Test your vector addition and subtraction skills.</p>
        <div class="space-y-4 pt-4">
            <input type="text" id="player-name" placeholder="Enter your name" class="w-full px-4 py-3 rounded-lg bg-gray-700 border border-gray-600 text-white focus:outline-none focus:border-cyan-400 text-lg text-center" />
            <button id="start-btn" class="w-full bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-4 rounded-lg text-xl transition duration-300">Begin Quiz</button>
        </div>
    </div>

    <!-- Game Container -->
    <div id="game-container" class="hidden w-full mx-auto p-6 bg-gray-800 rounded-xl shadow-2xl space-y-4 relative">
        <div class="flex justify-between items-center">
            <h1 class="game-title text-3xl font-bold text-cyan-400">Vector Quiz 2</h1>
            <div class="flex items-center space-x-4">
                 <div class="flex items-center space-x-2 text-sm text-gray-400">
                    <label for="debug-toggle" class="cursor-pointer">Debug</label>
                    <div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
                        <input type="checkbox" name="toggle" id="debug-toggle" class="toggle-checkbox absolute block w-6 h-6 rounded-full bg-white border-4 appearance-none cursor-pointer"/>
                        <label for="debug-toggle" class="toggle-label block overflow-hidden h-6 rounded-full bg-gray-600 cursor-pointer"></label>
                    </div>
                </div>
                <div class="text-right">
                    <p id="score" class="text-xl font-semibold">Score: 0</p>
                    <p id="question-counter" class="text-gray-400">Question: 1 / 5</p>
                </div>
            </div>
        </div>

        <div id="debug-info" class="hidden font-mono text-sm bg-gray-700 p-2 rounded-md text-center"></div>

        <div id="canvas-container">
            <canvas id="vector-canvas"></canvas>
        </div>

        <div id="question-area" class="text-center">
            <p id="question-text" class="text-2xl font-medium">Which vector represents the result?</p>
        </div>

        <div id="options-area" class="grid grid-cols-2 gap-4">
        </div>

        <div class="flex space-x-4 mt-4">
            <button id="submit-btn" class="w-full bg-yellow-500 hover:bg-yellow-600 disabled:opacity-50 disabled:cursor-not-allowed text-gray-900 font-bold py-3 px-4 rounded-lg text-lg transition duration-300" disabled>Submit Answer</button>
            <button id="next-btn" class="hidden w-full bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-3 px-4 rounded-lg text-lg transition duration-300">Next Question</button>
        </div>

        <p id="feedback-text" class="text-center text-lg h-8 font-bold"></p>

        <div id="game-over-screen" class="hidden text-center space-y-6 py-6">
            <h2 id="end-title" class="text-4xl font-bold">Quiz Complete!</h2>
            
            <div class="space-y-1">
                <p id="final-score-text" class="text-5xl font-extrabold text-cyan-400 drop-shadow-lg">Your score: 5 / 5</p>
                <p id="unique-code" class="text-sm font-mono text-gray-500 tracking-widest opacity-80"></p>
            </div>

            <p id="final-feedback" class="text-xl text-gray-200 min-h-[4rem] flex items-center justify-center"></p>

            <div class="flex justify-center space-x-4 pt-6">
                <button id="play-again-btn" class="bg-cyan-500 hover:bg-cyan-600 text-white font-bold py-3 px-8 rounded-lg text-lg transition duration-300">Play Again</button>
            </div>
        </div>
    </div>

    <script>
    window.addEventListener('load', () => {
        // UI Elements
        const startScreen = document.getElementById('start-screen');
        const playerNameInput = document.getElementById('player-name');
        const startBtn = document.getElementById('start-btn');
        const gameContainer = document.getElementById('game-container');
        
        const canvas = document.getElementById('vector-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const questionCounterEl = document.getElementById('question-counter');
        const questionTextEl = document.getElementById('question-text');
        const questionArea = document.getElementById('question-area');
        const optionsArea = document.getElementById('options-area');
        const submitBtn = document.getElementById('submit-btn');
        const nextBtn = document.getElementById('next-btn');
        const feedbackTextEl = document.getElementById('feedback-text');
        
        const gameOverScreen = document.getElementById('game-over-screen');
        const endTitleEl = document.getElementById('end-title');
        const finalScoreTextEl = document.getElementById('final-score-text');
        const finalFeedbackEl = document.getElementById('final-feedback');
        const uniqueCodeEl = document.getElementById('unique-code');
        const playAgainBtn = document.getElementById('play-again-btn');
        
        const canvasContainer = document.getElementById('canvas-container');
        const debugInfoEl = document.getElementById('debug-info');
        const debugToggle = document.getElementById('debug-toggle');
        
        // Game State
        let playerName = "Student";
        let score = 0;
        let questionNumber = 1;
        const totalQuestions = 5;
        let v1, v2, operation, correctAnswer;
        let answerRevealed = false;
        let isDebugMode = false;
        let v1Origin, v2Origin;
        
        let selectedOptionData = null;
        let selectedOptionElement = null;

        // Dragging state
        let isDragging = false;
        let draggedVectorName = null;
        let dragOffset = { x: 0, y: 0 };
        const vectorScale = 8;
        const MAX_RESULTANT_MAG_SQ = 100;

        // Effusive Congratulations Generator (Produces 20 * 20 * 8 = 3,200 unique messages)
        const adj = ["Vector-tastic", "Magnificent", "Astounding", "Phenomenal", "Brilliant", "Transcendent", "Unparalleled", "Spectacular", "Stellar", "Marvelous", "Incredible", "Flawless", "Masterful", "Supreme", "Peerless", "Infallible", "Galactic", "Quantum", "Astonishing", "Epic"];
        const nouns = ["Vector Virtuoso", "Calculus Conqueror", "Geometric Genius", "Scalar Slayer", "Euclidean Enthusiast", "Magnitude Mastermind", "Directional Dynamo", "Tensor Titan", "Orthogonal Oracle", "Dimensional Dominator", "Hyperplane Hero", "Lineal Luminary", "Parallel Prodigy", "Matrix Marvel", "Dot Product Demigod", "Basis Boss", "Vector Voyager", "Projection Pro", "Coordinate Commander", "Space Sovereign"];
        const phrases = ["You've mastered the grid!", "Flawless victory!", "The math gods bow to you!", "Pure perfection!", "Absolutely legendary!", "You're unstoppable!", "A magnificent display of skill!", "Vector perfection achieved!"];

        function getUniqueEffusiveMessage(name) {
            const randomAdj = adj[Math.floor(Math.random() * adj.length)];
            const randomNoun = nouns[Math.floor(Math.random() * nouns.length)];
            const randomPhrase = phrases[Math.floor(Math.random() * phrases.length)];
            return `${randomAdj} ${randomNoun}, ${name}! ${randomPhrase}`;
        }

        // Generate Unique ID incorporating name
        function generateUniqueCode(name) {
            const safeName = name.replace(/[^a-zA-Z]/g, '').padEnd(3, 'X').toUpperCase();
            const hex = () => Math.floor(Math.random() * 65535).toString(16).padStart(4, '0').toUpperCase();
            return `VQ2-${hex()}-${safeName[0]}-${hex()}-${safeName[1]}-${hex()}-${safeName[2]}-${hex()}`;
        }

        // Ballistic Confetti System
        function ballisticConfetti(originX, originY) {
            const colors = ['#fce18a', '#ff726d', '#b48def', '#f4306d', '#4ade80', '#60a5fa'];
            const particles = [];
            
            for (let i = 0; i < 70; i++) {
                const p = document.createElement('div');
                p.style.position = 'fixed';
                p.style.left = originX + 'px';
                p.style.top = originY + 'px';
                p.style.width = (Math.random() * 8 + 6) + 'px';
                p.style.height = (Math.random() * 8 + 6) + 'px';
                p.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                p.style.zIndex = '9999';
                p.style.pointerEvents = 'none';
                document.body.appendChild(p);

                // Upward angle spread
                const angle = Math.random() * Math.PI + Math.PI; 
                const velocity = Math.random() * 15 + 15; // Initial burst speed
                
                particles.push({
                    el: p,
                    vx: Math.cos(angle) * velocity,
                    vy: Math.sin(angle) * velocity,
                    rot: Math.random() * 15 - 7.5,
                    currentRot: Math.random() * 360,
                    x: originX,
                    y: originY
                });
            }

            function animateParticles() {
                let active = false;
                particles.forEach(p => {
                    if (p.y < window.innerHeight + 20) {
                        active = true;
                        p.vy += 0.6; // Gravity
                        p.x += p.vx;
                        p.y += p.vy;
                        p.currentRot += p.rot;
                        p.el.style.transform = `translate(${p.x - originX}px, ${p.y - originY}px) rotate(${p.currentRot}deg)`;
                    } else if (p.el.parentNode) {
                        p.el.parentNode.removeChild(p.el);
                    }
                });
                
                if (active) requestAnimationFrame(animateParticles);
            }
            requestAnimationFrame(animateParticles);
        }

        function trigger3Bursts() {
            const w = window.innerWidth;
            const h = window.innerHeight;
            // Center, then left, then right
            ballisticConfetti(w / 2, h);
            setTimeout(() => ballisticConfetti(w * 0.2, h), 600);
            setTimeout(() => ballisticConfetti(w * 0.8, h), 1200);
        }

        // --- Math & Canvas Functions ---

        function generateVisibleVector() {
            const randComp = () => Math.floor(Math.random() * 19) - 9 || 1;
            let x, y;
            do {
                x = randComp();
                y = randComp();
            } while (Math.abs(x) < 3 && Math.abs(y) < 3);
            return { x, y };
        }

        function setupCanvas(width, height) {
            ctx.resetTransform();
            const dpr = window.devicePixelRatio || 1;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);
            ctx.translate(width / 2, height / 2);
            ctx.scale(1, -1);
        }

        function drawVector(vec, origin, color, label) {
            ctx.beginPath();
            ctx.moveTo(origin.x, origin.y);
            ctx.lineTo(origin.x + vec.x * vectorScale, origin.y + vec.y * vectorScale);
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
            const headlen = 10;
            const angle = Math.atan2(vec.y, vec.x);
            ctx.beginPath();
            ctx.moveTo(origin.x + vec.x * vectorScale, origin.y + vec.y * vectorScale);
            ctx.lineTo(origin.x + vec.x * vectorScale - headlen * Math.cos(angle - Math.PI / 6), origin.y + vec.y * vectorScale - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(origin.x + vec.x * vectorScale, origin.y + vec.y * vectorScale);
            ctx.lineTo(origin.x + vec.x * vectorScale - headlen * Math.cos(angle + Math.PI / 6), origin.y + vec.y * vectorScale - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.save();
            ctx.scale(1, -1);
            ctx.fillStyle = color;
            ctx.font = 'bold 16px Inter';
            ctx.fillText(label, origin.x - 20, -(origin.y - 10));
            ctx.restore();
        }

        function drawMiniVector(canvasEl, vec) {
            const ctx = canvasEl.getContext('2d');
            const rect = canvasEl.getBoundingClientRect();
            const dpr = window.devicePixelRatio || 1;
            canvasEl.width = rect.width * dpr;
            canvasEl.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            
            ctx.fillStyle = '#4a5568';
            ctx.fillRect(0, 0, rect.width, rect.height);

            ctx.translate(rect.width / 2, rect.height / 2);
            ctx.scale(1, -1);

            ctx.beginPath();
            ctx.strokeStyle = '#2d3748';
            ctx.lineWidth = 0.5;
            ctx.moveTo(-rect.width / 2, 0); ctx.lineTo(rect.width / 2, 0);
            ctx.moveTo(0, -rect.height / 2); ctx.lineTo(0, rect.height / 2);
            ctx.stroke();

            const scale = 8;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(vec.x * scale, vec.y * scale);
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.stroke();

            const headlen = 8;
            const angle = Math.atan2(vec.y, vec.x);
            ctx.beginPath();
            ctx.moveTo(vec.x * scale, vec.y * scale);
            ctx.lineTo(vec.x * scale - headlen * Math.cos(angle - Math.PI / 6), vec.y * scale - headlen * Math.sin(angle - Math.PI / 6));
            ctx.moveTo(vec.x * scale, vec.y * scale);
            ctx.lineTo(vec.x * scale - headlen * Math.cos(angle + Math.PI / 6), vec.y * scale - headlen * Math.sin(angle + Math.PI / 6));
            ctx.strokeStyle = '#facc15';
            ctx.lineWidth = 2;
            ctx.stroke();
        }
        
        function drawGrid() {
            const scale = 4;
            const width = canvasContainer.clientWidth;
            const height = canvasContainer.clientHeight;
            ctx.beginPath();
            ctx.strokeStyle = '#2d3748';
            ctx.lineWidth = 0.5;
            for (let x = scale; x < width / 2; x += scale) {
                ctx.moveTo(x, -height / 2); ctx.lineTo(x, height / 2);
                ctx.moveTo(-x, -height / 2); ctx.lineTo(-x, height / 2);
            }
            for (let y = scale; y < height / 2; y += scale) {
                ctx.moveTo(-width / 2, y); ctx.lineTo(width / 2, y);
                ctx.moveTo(-width / 2, -y); ctx.lineTo(-width / 2, -y);
            }
            ctx.stroke();
            ctx.beginPath();
            ctx.strokeStyle = '#4a5568';
            ctx.lineWidth = 1;
            ctx.moveTo(-width / 2, 0); ctx.lineTo(width / 2, 0);
            ctx.moveTo(0, -height / 2); ctx.lineTo(0, height / 2);
            ctx.stroke();
        }

        function draw2DScene() {
            if (!v1 || !v2) return;
            const cssWidth = canvasContainer.clientWidth;
            const cssHeight = canvasContainer.clientHeight;
            if (cssWidth === 0 || cssHeight === 0) return;
            ctx.clearRect(-cssWidth / 2, -cssHeight / 2, cssWidth, cssHeight);
            drawGrid();
            drawVector(v1, v1Origin, '#67e8f9', 'A');
            drawVector(v2, v2Origin, '#f0abfc', 'B');
        }

        // --- Game Logic ---

        function generateQuestion() {
            answerRevealed = false;
            feedbackTextEl.textContent = '';
            
            submitBtn.classList.remove('hidden');
            submitBtn.disabled = true;
            nextBtn.classList.add('hidden');
            
            selectedOptionData = null;
            selectedOptionElement = null;
            
            let magSq;
            do {
                v1 = generateVisibleVector();
                v2 = generateVisibleVector();
                operation = Math.random() < 0.5 ? '+' : '-';
                correctAnswer = (operation === '+') ? { x: v1.x + v2.x, y: v1.y + v2.y } : { x: v1.x - v2.x, y: v1.y - v2.y };
                magSq = correctAnswer.x * correctAnswer.x + correctAnswer.y * correctAnswer.y;
            } while (magSq > MAX_RESULTANT_MAG_SQ || (correctAnswer.x === 0 && correctAnswer.y === 0));

            if (isDebugMode) {
                debugInfoEl.innerHTML = `A:&lang;${v1.x},${v1.y}&rang; B:&lang;${v2.x},${v2.y}&rang; Correct:&lang;${correctAnswer.x},${correctAnswer.y}&rang;`;
            }

            questionTextEl.innerHTML = `Which vector represents <span class="font-bold text-cyan-300">A</span> ${operation} <span class="font-bold text-fuchsia-300">B</span>?`;
            
            const distractors = [];
            distractors.push(operation === '+' ? { x: v1.x - v2.x, y: v1.y - v2.y } : { x: v1.x + v2.x, y: v1.y + v2.y });
            if (operation === '-') distractors.push({ x: v2.x - v1.x, y: v2.y - v1.y });
            else distractors.push({ x: -correctAnswer.x, y: -correctAnswer.y });
            
            distractors.push({ x: correctAnswer.y, y: correctAnswer.x });
            distractors.push({ x: -correctAnswer.x, y: correctAnswer.y });
            distractors.push({ x: correctAnswer.x, y: -correctAnswer.y });
            distractors.push(v1, v2);
            distractors.sort(() => Math.random() - 0.5);

            let options = [correctAnswer];
            const usedOptions = new Set([`⟨${correctAnswer.x}, ${correctAnswer.y}⟩`]);

            for (const distractor of distractors) {
                if (options.length >= 4) break;
                const optionString = `⟨${distractor.x}, ${distractor.y}⟩`;
                if (!usedOptions.has(optionString)) {
                    options.push(distractor);
                    usedOptions.add(optionString);
                }
            }
            
            options.sort(() => Math.random() - 0.5);
            optionsArea.innerHTML = '';
            
            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.classList.add('option-btn', 'bg-gray-700', 'border-2', 'border-gray-600', 'rounded-lg');
                const miniCanvas = document.createElement('canvas');
                miniCanvas.classList.add('w-full', 'h-60');
                btn.appendChild(miniCanvas);
                btn.dataset.answer = JSON.stringify(opt);
                btn.addEventListener('click', onOptionSelect);
                optionsArea.appendChild(btn);
                requestAnimationFrame(() => drawMiniVector(miniCanvas, opt));
            });
            draw2DScene();
        }

        function onOptionSelect(event) {
            if (answerRevealed) return;
            
            // Remove selection from others
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('selected'));
            
            // Add selection to clicked
            selectedOptionElement = event.currentTarget;
            selectedOptionElement.classList.add('selected');
            selectedOptionData = JSON.parse(selectedOptionElement.dataset.answer);
            
            // Enable submit button
            submitBtn.disabled = false;
        }

        function checkAnswer() {
            if (answerRevealed || !selectedOptionData) return;
            answerRevealed = true;
            
            const isCorrect = selectedOptionData.x === correctAnswer.x && selectedOptionData.y === correctAnswer.y;

            if (isCorrect) {
                score++;
                scoreEl.textContent = `Score: ${score}`;
                feedbackTextEl.textContent = "Correct!";
                feedbackTextEl.className = "text-center text-lg h-8 font-bold text-green-400";
                selectedOptionElement.classList.add('correct');
            } else {
                feedbackTextEl.textContent = 'Incorrect!';
                feedbackTextEl.className = "text-center text-lg h-8 font-bold text-red-400";
                selectedOptionElement.classList.add('incorrect');
                
                // Show actual correct answer
                document.querySelectorAll('.option-btn').forEach(btn => {
                    const btnAnswer = JSON.parse(btn.dataset.answer);
                    if (btnAnswer.x === correctAnswer.x && btnAnswer.y === correctAnswer.y) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Lock interactions
            document.querySelectorAll('.option-btn').forEach(btn => btn.classList.add('pointer-events-none'));
            selectedOptionElement.classList.remove('selected'); // clean up yellow border

            // Swap buttons
            submitBtn.classList.add('hidden');
            
            if (questionNumber === totalQuestions) {
                nextBtn.textContent = 'Finish Quiz';
            } else {
                nextBtn.textContent = 'Next Question';
            }
            nextBtn.classList.remove('hidden');
        }
        
        function nextQuestion() {
            if (questionNumber === totalQuestions) {
                endGame();
            } else {
                questionNumber++;
                questionCounterEl.textContent = `Question: ${questionNumber} / ${totalQuestions}`;
                generateQuestion();
            }
        }

        function endGame() {
            optionsArea.classList.add('hidden');
            questionArea.classList.add('hidden');
            nextBtn.classList.add('hidden');
            submitBtn.classList.add('hidden');
            feedbackTextEl.classList.add('hidden');

            finalScoreTextEl.textContent = `Your score: ${score} / ${totalQuestions}`;
            uniqueCodeEl.textContent = generateUniqueCode(playerName);

            if (score === totalQuestions) {
                endTitleEl.textContent = "Perfect Score!";
                endTitleEl.className = "text-4xl font-bold text-yellow-400";
                finalFeedbackEl.textContent = getUniqueEffusiveMessage(playerName);
                trigger3Bursts();
            } else if (score >= 4) {
                endTitleEl.textContent = "Great Job!";
                endTitleEl.className = "text-4xl font-bold text-green-400";
                finalFeedbackEl.textContent = `Congratulations, ${playerName}! You're really getting the hang of vectors.`;
            } else {
                endTitleEl.textContent = "Keep Practicing!";
                endTitleEl.className = "text-4xl font-bold text-white";
                finalFeedbackEl.textContent = `Good effort, ${playerName}. Try again to master your vector skills!`;
            }

            gameOverScreen.classList.remove('hidden');
        }

        function resetGame() {
            score = 0;
            questionNumber = 1;
            answerRevealed = false;

            scoreEl.textContent = `Score: 0`;
            questionCounterEl.textContent = `Question: 1 / ${totalQuestions}`;
            
            gameOverScreen.classList.add('hidden');
            optionsArea.classList.remove('hidden');
            questionArea.classList.remove('hidden');
            feedbackTextEl.classList.remove('hidden');
            feedbackTextEl.textContent = '';
            
            v1Origin = { x: (Math.random() - 0.7) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };
            v2Origin = { x: (Math.random() - 0.3) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };

            handleResize();
            generateQuestion();
        }
        
        // --- Interactivity & Dragging ---
        
        function handleResize() {
            const width = gameContainer.clientWidth;
            if (width === 0) return;
            const height = width * 0.75;
            canvasContainer.style.height = `${height}px`;
            
            requestAnimationFrame(() => {
                setupCanvas(width, height);
                draw2DScene();
            });
        }
        
        function getCanvasMousePosition(event) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = event.clientX - rect.left;
            const mouseY = event.clientY - rect.top;
            const translatedX = mouseX - canvas.width / (2 * (window.devicePixelRatio || 1));
            const translatedY = -(mouseY - canvas.height / (2 * (window.devicePixelRatio || 1)));
            return { x: translatedX, y: translatedY };
        }

        function distToSegmentSquared(p, a, b) {
            const l2 = (b.x - a.x) * (b.x - a.x) + (b.y - a.y) * (b.y - a.y);
            if (l2 === 0) return (p.x - a.x) * (p.x - a.x) + (p.y - a.y) * (p.y - a.y);
            let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            const closestPoint = { x: a.x + t * (b.x - a.x), y: a.y + t * (b.y - a.y) };
            return (p.x - closestPoint.x) * (p.x - closestPoint.x) + (p.y - closestPoint.y) * (p.y - closestPoint.y);
        }

        function getVectorAtPoint(point) {
            const tolerance = 25; 
            const v1End = { x: v1Origin.x + v1.x * vectorScale, y: v1Origin.y + v1.y * vectorScale };
            const v2End = { x: v2Origin.x + v2.x * vectorScale, y: v2Origin.y + v2.y * vectorScale };
            
            if (distToSegmentSquared(point, v1Origin, v1End) <= tolerance) return 'A';
            if (distToSegmentSquared(point, v2Origin, v2End) <= tolerance) return 'B';
            
            return null;
        }

        function onDragStart(event) {
            const point = getCanvasMousePosition(event);
            const vectorName = getVectorAtPoint(point);
            if (vectorName) {
                isDragging = true;
                draggedVectorName = vectorName;
                const origin = vectorName === 'A' ? v1Origin : v2Origin;
                dragOffset.x = point.x - origin.x;
                dragOffset.y = point.y - origin.y;
                canvas.style.cursor = 'grabbing';
            }
        }
        
        function onDrag(event) {
            const point = getCanvasMousePosition(event);
            const vectorName = getVectorAtPoint(point);
            if (!isDragging) {
                if (vectorName) canvas.style.cursor = 'pointer';
                else canvas.style.cursor = 'grab';
            }
            if (!isDragging) return;
            event.preventDefault(); 
            const newOrigin = { x: point.x - dragOffset.x, y: point.y - dragOffset.y };

            if (draggedVectorName === 'A') v1Origin = newOrigin;
            else if (draggedVectorName === 'B') v2Origin = newOrigin;
            
            draw2DScene();
        }

        function onDragEnd() {
            isDragging = false;
            draggedVectorName = null;
            canvas.style.cursor = 'grab';
        }

        // --- Event Listeners ---

        startBtn.addEventListener('click', () => {
            const enteredName = playerNameInput.value.trim();
            if (enteredName) playerName = enteredName;
            
            startScreen.classList.add('hidden');
            gameContainer.classList.remove('hidden');
            
            // Init game
            v1Origin = { x: (Math.random() - 0.7) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };
            v2Origin = { x: (Math.random() - 0.3) * (gameContainer.clientWidth / 8), y: (Math.random() - 0.5) * (gameContainer.clientHeight / 5) };

            handleResize();
            generateQuestion();
        });

        playerNameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') startBtn.click();
        });

        window.addEventListener('resize', handleResize);
        submitBtn.addEventListener('click', checkAnswer);
        nextBtn.addEventListener('click', nextQuestion);
        playAgainBtn.addEventListener('click', resetGame);
        
        debugToggle.addEventListener('change', () => {
            isDebugMode = debugToggle.checked;
            if (isDebugMode) {
                debugInfoEl.classList.remove('hidden');
                debugInfoEl.innerHTML = `A:&lang;${v1.x},${v1.y}&rang; B:&lang;${v2.x},${v2.y}&rang; Correct:&lang;${correctAnswer.x},${correctAnswer.y}&rang;`;
            } else {
                debugInfoEl.classList.add('hidden');
            }
        });

        canvas.addEventListener('mousedown', onDragStart);
        canvas.addEventListener('mousemove', onDrag);
        canvas.addEventListener('mouseup', onDragEnd);
        canvas.addEventListener('mouseleave', onDragEnd);
        canvas.addEventListener('touchstart', (e) => onDragStart(e.touches[0]), { passive: false });
        canvas.addEventListener('touchmove', (e) => onDrag(e.touches[0]), { passive: false });
        canvas.addEventListener('touchend', onDragEnd);
    });
    </script>
</body>
