<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vector Components Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            animation: fall 5s linear forwards;
        }
        @keyframes fall {
            to {
                transform: translateY(100vh) rotate(720deg);
                opacity: 0;
            }
        }
        .modal {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
        }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
          -webkit-appearance: none; 
          margin: 0; 
        }
        input[type=number] {
          -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center h-screen p-2 sm:p-4 overflow-hidden">

    <div id="game-container" class="w-full max-w-5xl h-full flex flex-col bg-gray-800 rounded-2xl shadow-2xl p-4 sm:p-6">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row justify-between items-center mb-4 border-b border-gray-700 pb-4">
            <h1 class="text-xl sm:text-3xl font-bold text-cyan-400 mb-2 sm:mb-0 text-center">Vector Components Calculator</h1>
            <div class="flex items-center space-x-2 sm:space-x-4 text-md">
                <div class="bg-gray-700 px-3 py-2 rounded-lg">
                    <span>Score: <span id="score" class="font-bold text-yellow-400">0</span></span>
                </div>
                <div class="bg-gray-700 px-3 py-2 rounded-lg">
                    <span>Round: <span id="round" class="font-bold text-green-400">1 / 3</span></span>
                </div>
            </div>
        </div>

        <!-- Main Content Area -->
        <div class="flex-grow w-full flex flex-col lg:flex-row gap-4 min-h-0">
            <!-- Left Panel: Info & Inputs -->
            <div class="lg:w-1/2 flex flex-col bg-gray-900/50 rounded-lg p-4 justify-center">
                 <div id="vector-info" class="text-center bg-gray-700/50 p-3 rounded-lg mb-4">
                    <h2 class="font-bold text-lg text-amber-400">Given Vector (V)</h2>
                    <p>Magnitude: <span id="magnitude" class="font-semibold">--</span></p>
                    <p>Angle: <span id="angle" class="font-semibold">--</span>° (from +x axis)</p>
                </div>
                <div id="instructions" class="text-center text-gray-300 mb-4">
                   Use the magnitude and angle to calculate the vector components.
                </div>
                <div id="input-section" class="space-y-4">
                    <div>
                        <label for="x-component-input" class="block text-sm font-medium text-cyan-400">X-Component (Vx)</label>
                        <input type="number" id="x-component-input" class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-cyan-500 focus:border-cyan-500" placeholder="e.g., -45.5">
                    </div>
                    <div>
                        <label for="y-component-input" class="block text-sm font-medium text-emerald-400">Y-Component (Vy)</label>
                        <input type="number" id="y-component-input" class="mt-1 block w-full bg-gray-700 border border-gray-600 rounded-md shadow-sm py-2 px-3 text-white focus:outline-none focus:ring-emerald-500 focus:border-emerald-500" placeholder="e.g., 25.0">
                    </div>
                </div>
            </div>

            <!-- Right Panel: Canvas for Visualization -->
            <div class="flex-grow w-full h-64 lg:h-auto min-h-0 relative rounded-lg overflow-hidden bg-gray-900/50 lg:w-1/2">
                 <canvas id="gameCanvas" class="absolute top-0 left-0"></canvas>
            </div>
        </div>

        <!-- Controls -->
        <div class="flex justify-center items-center mt-4 space-x-4">
            <button id="checkButton" class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded-lg transition-all duration-200">Check Answer</button>
            <button id="resetButton" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-lg transition-all duration-200">Reset Game</button>
        </div>
    </div>

    <!-- Modal -->
    <div id="feedbackModal" class="fixed inset-0 bg-black bg-opacity-70 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-gray-800 rounded-2xl p-8 text-center shadow-xl border border-gray-700 transform scale-95 opacity-0 modal max-w-md">

                <button id="modalButtonSecondary" class="bg-gray-500 hover:bg-gray-600 text-white font-bold py-3 px-8 rounded-lg text-lg transition-transform duration-200 hover:scale-105 hidden"></button>
            </div>
        </div>
    </div>

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function setupCanvas() {
            const dpr = window.devicePixelRatio || 1;
            const rect = gameContainer.getBoundingClientRect();
            canvas.width = rect.width * dpr;
            canvas.height = rect.height * dpr;
            ctx.scale(dpr, dpr);
            canvas.style.width = `${rect.width}px`;
            canvas.style.height = `${rect.height}px`;
            draw();
        }

        function startGame() {
            score = 0; round = 1;
            quadrantOrder = [1, 2, 3, 4];
            shuffleArray(quadrantOrder);
            startRound();
        }

        function startRound() {
            updateUI();
            resetInputs();
            generateVector();
            draw();
        }
        
        function generateVector() {
            const quadrant = quadrantOrder[round - 1];
            
            const magnitude = Math.random() * 90 + 10; // Magnitude between 10 and 100
            let angleDeg;

            switch(quadrant) {
                case 1: angleDeg = Math.random() * 70 + 10; break; // 10-80
                case 2: angleDeg = Math.random() * 70 + 100; break; // 100-170
                case 3: angleDeg = Math.random() * 70 + 190; break; // 190-260
                case 4: angleDeg = Math.random() * 70 + 280; break; // 280-350
            }
            
            const angleRad = angleDeg * Math.PI / 180;
            const vx = magnitude * Math.cos(angleRad);
            const vy = magnitude * Math.sin(angleRad);
            
            // For drawing, we use a fixed pixel length to avoid giving visual clues
            const displayMagnitudePx = Math.min(canvas.offsetWidth, canvas.offsetHeight) * 0.4;
            const displayDx = displayMagnitudePx * Math.cos(angleRad);
            const displayDy = -displayMagnitudePx * Math.sin(angleRad);


            originalVector = {
                x: canvas.offsetWidth / 2, y: canvas.offsetHeight / 2,
                dx: displayDx,
                dy: displayDy,
                vx: vx, vy: vy,
                magnitude: magnitude, angle: angleDeg,
                color: '#f59e0b'
            };
            
            currentUnit = UNITS[Math.floor(Math.random() * UNITS.length)];
            magnitudeEl.innerHTML = `${magnitude.toFixed(1)} <span class="text-gray-400">${currentUnit}</span>`;
            angleEl.textContent = angleDeg.toFixed(1);
        }
        
        function drawAxes() {
            const w = canvas.offsetWidth;
            const h = canvas.offsetHeight;
            const originX = w / 2;
            const originY = h / 2;
            const PIXELS_PER_UNIT = 30; // Grid spacing for visual effect only

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            // X and Y axes
            ctx.beginPath(); ctx.moveTo(0, originY); ctx.lineTo(w, originY); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(originX, 0); ctx.lineTo(originX, h); ctx.stroke();
            // Grid
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
            for (let x = originX; x < w; x += PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
            for (let x = originX; x > 0; x -= PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke(); }
            for (let y = originY; y < h; y += PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
            for (let y = originY; y > 0; y -= PIXELS_PER_UNIT) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
        }

        function drawVector(vector, options = {}) {
             ctx.strokeStyle = options.color || vector.color;
            ctx.fillStyle = options.color || vector.color;
            ctx.lineWidth = options.lineWidth || 4;
            const headlen = 10;
            const angle = Math.atan2(vector.dy, vector.dx);
            ctx.beginPath(); ctx.moveTo(vector.x, vector.y); ctx.lineTo(vector.x + vector.dx, vector.y + vector.dy); ctx.stroke();
            ctx.beginPath(); ctx.moveTo(vector.x + vector.dx, vector.y + vector.dy);
            ctx.lineTo(vector.x + vector.dx - headlen * Math.cos(angle - Math.PI / 6), vector.y + vector.dy - headlen * Math.sin(angle - Math.PI / 6));
            ctx.lineTo(vector.x + vector.dx - headlen * Math.cos(angle + Math.PI / 6), vector.y + vector.dy - headlen * Math.sin(angle + Math.PI / 6));
            ctx.closePath(); ctx.fill();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawAxes();
            if (originalVector) { drawVector(originalVector); }
        }
        
        function checkAnswer() {
            let scoreThisRound = 0;
            let feedback = "";
            const totalPointsThisRound = 2;

            const xVal = parseFloat(xInput.value);
            const yVal = parseFloat(yInput.value);
            const xIsCorrect = Math.abs(xVal - originalVector.vx) < Math.abs(originalVector.vx * VALUE_TOLERANCE) + 0.1;
            const yIsCorrect = Math.abs(yVal - originalVector.vy) < Math.abs(originalVector.vy * VALUE_TOLERANCE) + 0.1;

            xInput.classList.toggle('ring-2', true);
            yInput.classList.toggle('ring-2', true);
            xInput.classList.toggle('ring-green-500', xIsCorrect);
            xInput.classList.toggle('ring-red-500', !xIsCorrect);
            yInput.classList.toggle('ring-green-500', yIsCorrect);
            yInput.classList.toggle('ring-red-500', !yIsCorrect);

            if (!isNaN(xVal) && xIsCorrect) scoreThisRound++;
            if (!isNaN(yVal) && yIsCorrect) scoreThisRound++;
            
            score += scoreThisRound;

            if (round >= TOTAL_ROUNDS) {
                if (score === 6) {
                    showModal('Flawless Victory!', `You got 6 out of 5! Well beyond perfect! ${getRandomFlawlessCongrats()}`, gameOver);
                    launchConfetti();
                } else if (score === 5) {
                    showModal('Perfect Score!', `You finished with a perfect score of 5 out of 5! ${getRandomCongrats()}`, gameOver);
                    launchConfetti();
                } else {
                    showModal('Game Over', `You finished with ${score} out of 5. Keep practicing!`, gameOver);
                }
            } else {
                if (scoreThisRound === totalPointsThisRound) {
                    showModal('Perfect!', `Both component values are correct! (+${scoreThisRound} points)`, () => { round++; startRound(); });
                } else {
                    if (!xIsCorrect && !yIsCorrect) {
                        feedback = `Both the X and Y component values are incorrect. (+0 points)`;
                    } else if (!xIsCorrect) {
                        feedback = `The X-component value is incorrect. Check your calculation. (+1 point)`;
                    } else { // !yIsCorrect
                        feedback = `The Y-component value is incorrect. Check your calculation. (+1 point)`;
                    }
                    showModal('Not Quite', feedback, () => { round++; startRound(); });
                }
            }
        }
        
        function resetInputs() {
            xInput.value = '';
            yInput.value = '';
            xInput.classList.remove('ring-2', 'ring-green-500', 'ring-red-500');
            yInput.classList.remove('ring-2', 'ring-green-500', 'ring-red-500');
        }

        function gameOver() {
            closeModal();
            startGame();
        }

        function updateUI() {
            scoreEl.textContent = score;
            const roundText = `${round} / ${TOTAL_ROUNDS}`;
            roundEl.textContent = roundText;
        }

        function showModal(title, message, onButtonClick, secondaryOptions = null) {
            modalTitleEl.textContent = title;
            modalMessageEl.textContent = message;
            modalButton.onclick = () => { closeModal(); onButtonClick(); };
            if (secondaryOptions) {
                modalButton.textContent = secondaryOptions.primaryText;
                modalButtonSecondary.textContent = secondaryOptions.secondaryText;
                modalButtonSecondary.classList.remove('hidden');
                modalButtonSecondary.onclick = () => { closeModal(); secondaryOptions.onClick(); };
            } else {
                modalButton.textContent = 'Continue';
                modalButtonSecondary.classList.add('hidden');
            }
            feedbackModal.classList.remove('hidden');
            setTimeout(() => feedbackModal.querySelector('.modal').classList.remove('scale-95', 'opacity-0'), 10);
        }

        function closeModal() {
            const modalContent = feedbackModal.querySelector('.modal');
            modalContent.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                feedbackModal.classList.add('hidden');
                 if (!feedbackModal.classList.contains('flex')) {
                   feedbackModal.classList.add('flex', 'items-center', 'justify-center');
                }
                modalContent.style.position = '';
                modalContent.style.top = '';
                modalContent.style.left = '';
            }, 300);
        }

        function getRandomCongrats() {
            return CONGRATS_MESSAGES[Math.floor(Math.random() * CONGRATS_MESSAGES.length)];
        }

        function getRandomFlawlessCongrats() {
            return FLAWLESS_MESSAGES[Math.floor(Math.random() * FLAWLESS_MESSAGES.length)];
        }
        
        function launchConfetti() {
            for (let i = 0; i < 200; i++) {
                const confetto = document.createElement('div');
                confetto.classList.add('confetti');
                confetto.style.left = Math.random() * 100 + 'vw';
                confetto.style.top = -20 + 'px';
                confetto.style.backgroundColor = `hsl(${Math.random() * 360}, 100%, 50%)`;
                confetto.style.animationDelay = Math.random() * 3 + 's';
                confetto.style.transform = `scale(${Math.random() * 0.8 + 0.5})`;
                document.body.appendChild(confetto);
                setTimeout(() => confetto.remove(), 5000);
            }
        }
        
        function makeDraggable(elmnt, handle) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            const dragHandle = handle || elmnt;

            dragHandle.onmousedown = dragMouseDown;

            function dragMouseDown(e) {
                e = e || window.event;
                const target = e.target || e.srcElement;
                if (target.tagName === 'BUTTON' || target.tagName === 'INPUT') return;
                
                e.preventDefault();
                pos3 = e.clientX;
                pos4 = e.clientY;
                document.onmouseup = closeDragElement;
                document.onmousemove = elementDrag;
                
                if (feedbackModal.classList.contains('flex')) {
                    feedbackModal.classList.remove('flex', 'items-center', 'justify-center');
                    elmnt.style.position = 'absolute';
                    const rect = elmnt.getBoundingClientRect();
                    elmnt.style.left = rect.left + 'px';
                    elmnt.style.top = rect.top + 'px';
                }
            }

            function elementDrag(e) {
                e = e || window.event;
                e.preventDefault();
                pos1 = pos3 - e.clientX;
                pos2 = pos4 - e.clientY;
                pos3 = e.clientX;
                pos4 = e.clientY;
                elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
                elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
            }

            function closeDragElement() {
                document.onmouseup = null;
                document.onmousemove = null;
            }
        }


        window.addEventListener('resize', setupCanvas);
        checkButton.addEventListener('click', checkAnswer);
        resetButton.addEventListener('click', startGame);

        setupCanvas();
        startGame();
        makeDraggable(feedbackModal.querySelector('.modal'), modalTitleEl);

    </script>
</body>
</html>
